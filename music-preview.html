<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <script>
    (() => {
      const q = new URLSearchParams(location.search).get('theme');
      const saved = localStorage.getItem('kh_music_theme');
      const theme = q === 'dark' || q === 'light' ? q : (saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copilot Studio Ignite Boom-Bap Rap — Local MLX Studio Preview</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f3ee; --card: #ffffff; --surface: #f1ede5; --border: #dfdad0;
      --text: #1c1917; --muted: #665f57; --accent: #b11f4b; --accent-soft: rgba(177,31,75,.11);
      --accent-fg: #ffffff; --bar-idle: #d5cec2; --shadow: 0 18px 44px rgba(28,25,23,.08);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #171615; --card: #22201f; --surface: #2b2927; --border: #3a3734;
      --text: #f3efe9; --muted: #a8a096; --accent: #ff7a98; --accent-soft: rgba(255,122,152,.15);
      --accent-fg: #181315; --bar-idle: #433f3b; --shadow: 0 22px 52px rgba(0,0,0,.42);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px 16px 40px; }
    .shell { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .back { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
    .back:hover { color: var(--accent); }
    .top-actions { display: flex; gap: 8px; }
    .chip-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 6px 13px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .chip-btn:hover { border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: 400px 1fr; gap: 18px; align-items: start; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 22px; box-shadow: var(--shadow); }
    .badge { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 4px 11px; font-size: 12px; font-weight: 700; letter-spacing: .02em; margin-bottom: 10px; }
    h1 { font-size: 22px; line-height: 1.28; letter-spacing: -.01em; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 13px; line-height: 1.5; margin-bottom: 14px; }
    .specs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .spec { background: var(--surface); border-radius: 8px; padding: 4px 9px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    canvas#spectrum { width: 100%; height: 112px; display: block; background: var(--surface); border-radius: 14px; margin-bottom: 14px; }
    .transport { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    #play-btn { width: 48px; height: 48px; border-radius: 50%; border: none; background: var(--accent); color: var(--accent-fg); font-size: 18px; font-weight: 700; cursor: pointer; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; }
    #play-btn:disabled { opacity: .45; cursor: not-allowed; }
    .scrub { flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    #seek { width: 100%; accent-color: var(--accent); cursor: pointer; }
    .times { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .downloads { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .dl-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 11px; padding: 9px 10px; font-size: 12.5px; font-weight: 600; text-align: center; }
    .dl-btn:hover { border-color: var(--accent); color: var(--accent); }
    .dl-btn.full { grid-column: 1 / -1; }
    .prompt-box { margin-top: 14px; padding: 11px 12px; background: var(--surface); border-radius: 12px; font-size: 12px; color: var(--muted); line-height: 1.55; word-break: break-word; }
    .prompt-box strong { color: var(--text); display: block; margin-bottom: 4px; }
    .lyrics-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .lyrics-head h2 { font-size: 16px; }
    .status-note { font-size: 12px; color: var(--muted); }
    .lyrics-scroll { max-height: 560px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 4px; scroll-behavior: smooth; }
    .sec-card { padding: 12px 14px; border-radius: 14px; border: 1px solid transparent; background: var(--surface); transition: border-color .18s, background .18s; cursor: pointer; }
    .sec-card.active { border-color: var(--accent); background: var(--accent-soft); }
    .sec-tag { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 6px; display: flex; justify-content: space-between; }
    .sec-line { font-size: 14.5px; line-height: 1.72; color: var(--text); }
    @media (max-width: 880px) {
      .grid { grid-template-columns: 1fr; }
      .lyrics-scroll { max-height: 440px; }
      .downloads { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="back" href="./posts/local-music-song-models/index.html" data-zh="← 返回本地音乐模型深度解析" data-en="← Back to Local Music Models">← 返回本地音乐模型深度解析</a>
      <div class="top-actions">
        <button id="lang-btn" class="chip-btn" type="button">EN</button>
        <button id="theme-btn" class="chip-btn" type="button" data-zh="切换明暗" data-en="Theme">切换明暗</button>
      </div>
    </header>
    <main class="grid">
      <section class="panel" aria-label="Player">
        <span class="badge" data-zh="Apple Silicon MLX 本机离线实测" data-en="Apple Silicon MLX Local Offline Render">Apple Silicon MLX 本机离线实测</span>
        <h1 id="track-title">Copilot Studio Ignite Boom-Bap Rap</h1>
        <p class="sub" id="track-sub">Apple Silicon M4 Max · MiniMax-Music3-mxfp8 原生 MLX 本机全曲实测</p>
        <div class="specs" id="track-specs"></div>
        <canvas id="spectrum" width="680" height="180"></canvas>
        <div class="transport">
          <button id="play-btn" type="button" aria-label="Play or Pause">▶</button>
          <div class="scrub">
            <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
            <div class="times"><span id="cur-time">0:00</span><span id="tot-time">--:--</span></div>
          </div>
        </div>
        <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
        <div class="downloads">
          <a id="dl-wav" class="dl-btn" download><span data-zh="⬇ 下载无损 WAV" data-en="⬇ Lossless WAV">⬇ 下载无损 WAV</span></a>
          <a id="dl-m4a" class="dl-btn" download><span data-zh="⬇ 下载高音质 M4A (256kbps)" data-en="⬇ High-Quality M4A (256kbps)">⬇ 下载高音质 M4A (256kbps)</span></a>
        </div>
        <div class="prompt-box">
          <strong data-zh="风格提示词（原样输入）" data-en="Style Prompt (Exact Input)">风格提示词（原样输入）</strong>
          <span id="prompt-text"></span>
        </div>
      </section>
      <section class="panel" aria-label="Lyrics">
        <div class="lyrics-head">
          <h2 data-zh="分段同步滚动歌词（点击段落即可跳转）" data-en="Synchronized Section Lyrics (Click to Jump)">分段同步滚动歌词（点击段落即可跳转）</h2>
          <span class="status-note" id="sync-note" data-zh="就绪" data-en="Ready">就绪</span>
        </div>
        <div class="lyrics-scroll" id="lyrics-list"></div>
      </section>
    </main>
  </div>
  <script>
    (() => {
      const slug = (new URLSearchParams(location.search).get('track') || 'copilot-studio-ignite-rap').replace(/[^a-z0-9_-]/gi, '');
      const base = `/api/local-music/tracks/${slug}`;
      const audio = document.getElementById('audio'), playBtn = document.getElementById('play-btn'), seek = document.getElementById('seek');
      const curEl = document.getElementById('cur-time'), totEl = document.getElementById('tot-time'), listEl = document.getElementById('lyrics-list');
      const canvas = document.getElementById('spectrum'), ctx2d = canvas.getContext('2d'), noteEl = document.getElementById('sync-note');
      let lang = (new URLSearchParams(location.search).get('lang') === 'en') ? 'en' : 'zh';
      let meta = null, cues = [], actx = null, analyser = null, freq = null, activeIdx = -1;
      const fmt = s => !Number.isFinite(s) || s < 0 ? '0:00' : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
      function applyLang() {
        document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
        document.getElementById('lang-btn').textContent = lang === 'en' ? '中文' : 'EN';
        document.querySelectorAll('[data-zh]').forEach(el => { el.textContent = el.getAttribute(`data-${lang}`); });
        if (!audio.paused) noteEl.textContent = lang === 'en' ? 'Playing' : '播放中';
        else if (audio.currentTime > 0) noteEl.textContent = lang === 'en' ? 'Paused' : '已暂停';
        if (meta) {
          document.getElementById('track-title').textContent = meta.title?.[lang] || meta.slug;
          document.getElementById('track-sub').textContent = meta.subtitle?.[lang] || '';
        }
      }
      document.getElementById('lang-btn').onclick = () => { lang = lang === 'zh' ? 'en' : 'zh'; applyLang(); };
      document.getElementById('theme-btn').onclick = () => {
        const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('kh_music_theme', next);
      };
      function buildCues(dur) {
        if (!meta?.sections?.length) return;
        const totalW = meta.sections.reduce((s, x) => s + (x.weight || x.lines.length), 0);
        let acc = 0;
        cues = meta.sections.map((sec, idx) => {
          const start = sec.startSeconds ?? (dur * acc / totalW);
          acc += (sec.weight || sec.lines.length);
          const end = sec.endSeconds ?? (dur * acc / totalW);
          const stamp = document.getElementById(`stamp-${idx}`);
          if (stamp) stamp.textContent = fmt(start);
          return { start, end, idx };
        });
      }
      function updateActiveSection(t) {
        const found = cues.findIndex(c => t >= c.start && t < c.end);
        const idx = found === -1 && cues.length && t >= cues[cues.length - 1].start ? cues.length - 1 : found;
        if (idx !== activeIdx) {
          activeIdx = idx;
          listEl.querySelectorAll('.sec-card').forEach((el, i) => el.classList.toggle('active', i === idx));
          const card = listEl.children[idx];
          if (card && !audio.paused) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }
      }
      function ensureWebAudio() {
        if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        actx = new AC(); analyser = actx.createAnalyser(); analyser.fftSize = 128;
        actx.createMediaElementSource(audio).connect(analyser); analyser.connect(actx.destination);
        freq = new Uint8Array(analyser.frequencyBinCount);
      }
      function draw() {
        requestAnimationFrame(draw);
        const w = canvas.width, h = canvas.height, styles = getComputedStyle(document.documentElement);
        const accent = styles.getPropertyValue('--accent').trim(), idle = styles.getPropertyValue('--bar-idle').trim();
        ctx2d.clearRect(0, 0, w, h);
        const bars = 44, gap = 5, bw = (w - gap * (bars + 1)) / bars;
        if (analyser && !audio.paused) analyser.getByteFrequencyData(freq);
        for (let i = 0; i < bars; i++) {
          const v = (analyser && !audio.paused) ? freq[i % freq.length] / 255 : (0.14 + 0.08 * Math.sin(i * 0.45));
          const bh = Math.max(8, v * (h - 24)), x = gap + i * (bw + gap), y = h - bh - 10;
          ctx2d.fillStyle = !audio.paused ? accent : idle;
          ctx2d.beginPath(); ctx2d.roundRect(x, y, bw, bh, 5); ctx2d.fill();
        }
      }
      playBtn.onclick = () => { ensureWebAudio(); audio.paused ? audio.play() : audio.pause(); };
      audio.onplay = () => { playBtn.textContent = '⏸'; noteEl.textContent = lang === 'en' ? 'Playing' : '播放中'; };
      audio.onpause = () => { playBtn.textContent = '▶'; noteEl.textContent = lang === 'en' ? 'Paused' : '已暂停'; };
      audio.onloadedmetadata = () => { totEl.textContent = fmt(audio.duration); buildCues(audio.duration); };
      audio.ontimeupdate = () => {
        if (audio.duration) seek.value = String(Math.round((audio.currentTime / audio.duration) * 1000));
        curEl.textContent = fmt(audio.currentTime); updateActiveSection(audio.currentTime);
      };
      seek.oninput = () => { if (audio.duration) audio.currentTime = (Number(seek.value) / 1000) * audio.duration; };
      document.getElementById('dl-wav').href = `${base}.wav?download=1`;
      document.getElementById('dl-m4a').href = `${base}.m4a?download=1`;
      audio.src = `${base}.m4a`;
      audio.onerror = () => { if (!audio.src.endsWith('.wav')) audio.src = `${base}.wav`; };
      fetch(`${base}.meta.json`).then(r => r.ok ? r.json() : Promise.reject()).then(data => {
        meta = data;
        document.getElementById('prompt-text').textContent = data.prompt;
        const specs = [`${data.bpm} BPM`, data.key, `${(data.sampleRate / 1000).toFixed(1)} kHz Stereo`, 'mxfp8'];
        if (data.durationSeconds) specs.unshift(fmt(data.durationSeconds));
        document.getElementById('track-specs').innerHTML = specs.map(s => `<span class="spec">${s}</span>`).join('');
        listEl.innerHTML = data.sections.map((sec, idx) => `<div class="sec-card" data-idx="${idx}"><div class="sec-tag"><span>${sec.tag}</span><span id="stamp-${idx}">--:--</span></div>${sec.lines.map(l => `<p class="sec-line">${l}</p>`).join('')}</div>`).join('');
        listEl.querySelectorAll('.sec-card').forEach(el => {
          el.onclick = () => { const c = cues[Number(el.dataset.idx)]; if (c) { ensureWebAudio(); audio.currentTime = c.start; audio.play(); } };
        });
        if (audio.duration) buildCues(audio.duration);
        applyLang();
      }).catch(() => { noteEl.textContent = lang === 'en' ? 'Generating track…' : '音频生成中…'; });
      applyLang(); draw();
    })();
  </script>
</body>
</html>
