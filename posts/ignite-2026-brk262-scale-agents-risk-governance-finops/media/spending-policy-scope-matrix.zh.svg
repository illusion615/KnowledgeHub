="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">旧版无封顶 PayGo / 敞口实验</text><text x="777.5" y="387" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">旧 PPAC 无法对按量计费与 Azure P3 设硬上限，易引发月末账单惊吓</text></g></svg>
