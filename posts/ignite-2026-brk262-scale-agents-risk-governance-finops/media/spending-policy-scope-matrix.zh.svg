,140,0.05))"/><line x1="552" y1="98" x2="552" y2="436" stroke="var(--fig-axis-line, rgba(23,36,48,0.24))" stroke-width="1.35" stroke-dasharray="6 5"/><line x1="78" y1="267" x2="1026" y2="267" stroke="var(--fig-axis-line, rgba(23,36,48,0.24))" stroke-width="1.35" stroke-dasharray="6 5"/><text x="96" y="124" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="var(--fig-text-subtle, #64748b)">关键资产专款专护（Resource-Scoped）</text><text x="1008" y="124" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--fig-role-teal-text, #115e59)">受控团队创新池（MAC 组合重叠策略）</text><text x="96" y="422" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="var(--fig-text-subtle, #64748b)">传统静态切块孤岛（旧 PPAC 痛点）</text><text x="1008" y="422" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--fig-role-amber-text, #78350f)">无上限个人探索（月末透支与失控风险）</text><text x="552" y="474" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fig-text-muted, #52616d)">跨工具实验自由度与按人共享额度弹性 (0 → 100)</text><g transform="translate(26,267) rotate(-90)"><text x="0" y="0" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fig-text-muted, #52616d)">生产级业务连续性与硬封顶确定性 (0 → 100)</text></g><g data-point-id="askhr-asset-policy"><circle cx="287" cy="139" r="14.5" fill="var(--fig-role-teal-fill, rgba(13, 143, 140, 0.09))" stroke="var(--fig-role-teal-stroke, rgba(13, 143, 140, 0.46))" stroke-width="1"/><circle cx="287" cy="139" r="8.5" fill="var(--fig-role-teal-bar, #0d8f8c)"/><text x="307.5" y="136" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">全员核心资产策略（如 AskHR）</text><text x="307.5" y="153" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">独立资金池兜底，员工周末耗尽个人点数仍可正常提报人事工单</text></g><g data-point-id="lumen-prod-env"><circle cx="419" cy="179" r="14.5" fill="var(--fig-role-blue-fill, rgba(37, 99, 235, 0.07))" stroke="var(--fig-role-blue-stroke, rgba(59, 130, 246, 0.42))" stroke-width="1"/><circle cx="419" cy="179" r="8.5" fill="var(--fig-role-blue-bar, #2563eb)"/><text x="439.5" y="196" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">部门生产环境策略（Lumen 80% 预警）</text><text x="439.5" y="213" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">VP 级月度审批 + PayGo 硬封顶 + 80% 阈值告警，关联 Azure 订阅分摊</text></g><g data-point-id="mac-security-group"><circle cx="817" cy="159" r="14.5" fill="var(--fig-role-accent-fill, rgba(255, 122, 0, 0.09))" stroke="var(--fig-role-accent-stroke, rgba(234, 88, 12, 0.48))" stroke-width="1"/><circle cx="817" cy="159" r="8.5" fill="var(--fig-role-accent-bar, #ea580c)"/><text x="796.5" y="161" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">安全组跨端策略（20,000 点数示例）</text><text x="796.5" y="178" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">跨 Studio、Cowork 与 Work IQ 共享