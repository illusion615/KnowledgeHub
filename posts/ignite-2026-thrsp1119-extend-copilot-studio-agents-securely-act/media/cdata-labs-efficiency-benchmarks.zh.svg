04" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13" font-weight="600" fill="var(--fig-text-strong, #172430)">Study 3：传统 MCP 网关任务正确率</text><rect x="300" y="388" width="205" height="24" rx="6" fill="var(--fig-role-amber-bar, #d97706)" fill-opacity="0.88"/><text x="515" y="405" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" class="sr-figure-num" font-size="12" font-weight="700" fill="var(--fig-text-strong, #172430)">36.0%（914K tokens/次）</text><text x="585" y="474" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" font-size="12" font-weight="600" fill="var(--fig-text-muted, #52616d)">任务准确率 / 节省比例（0% – 100%）</text></svg>
