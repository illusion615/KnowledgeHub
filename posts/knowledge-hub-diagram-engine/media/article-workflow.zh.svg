<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1016" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">文章图表生成与验证流程</title><desc id="diagram-desc">flowchart diagram with 15 nodes and 14 connections</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs><path d="M 615 68 H 591 V 123 H 750 V 142" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="764" y="115" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">确定信息边界</text><path d="M 615 178 H 591 V 233 H 750 V 252" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="764" y="225" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">提交单一语义源</text><path d="M 615 288 H 591 V 343 H 585 V 362" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="599" y="335" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">通过</text><path d="M 615 288 H 591 V 343 H 915 V 362" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="929" y="335" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">失败</text><path d="M 450 398 H 426 V 453 H 750 V 472" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="764" y="445" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">提交几何模型</text><path d="M 615 508 H 591 V 563 H 585 V 582" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="599" y="555" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">通过</text><path d="M 615 508 H 591 V 563 H 915 V 582" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="929" y="555" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">失败</text><path d="M 450 618 H 426 V 673 H 750 V 692" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="764" y="665" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">嵌入静态产物</text><path d="M 750 764 V 783 H 585 V 802" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="599" y="775" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">检查最终上下文</text><path d="M 720 838 H 744 V 838 H 915 V 802" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="929" y="830" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">失败</text><path d="M 720 838 H 744 V 893 H 915 V 912" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="929" y="885" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">通过</text><path d="M 1050 398 H 1074 V 673 H 255 V 912" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="269" y="665" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">提交下一轮</text><path d="M 1050 618 H 1074 V 783 H 585 V 912" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="599" y="775" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">提交下一轮</text><path d="M 1050 838 H 1074 V 893 H 1245 V 912" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="1259" y="885" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">提交下一轮</text><g data-node-id="detect"><rect x="615" y="32" width="270" height="72" rx="12" fill="#FFF7EF" stroke="#E9B37D" stroke-width="1.5"/><text x="750" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#7C2D12"><tspan x="750" y="65">识别文章中的绘图需求</tspan></text><text x="750" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="750" y="90">架构图或流程图</tspan></text></g><g data-node-id="model"><rect x="615" y="142" width="270" height="72" rx="12" fill="#F7F8F9" stroke="#AAB4C0" stroke-width="1.5"/><text x="750" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#334155"><tspan x="750" y="175">生成 DiagramSpec</tspan></text><text x="750" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="750" y="200">一次定义中英文语义</tspan></text></g><g data-node-id="preflight"><rect x="615" y="252" width="270" height="72" rx="12" fill="#FFF9E8" stroke="#D4B266" stroke-width="1.5"/><text x="750" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#713F12"><tspan x="750" y="285">执行编译前校验</tspan></text><text x="750" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="750" y="310">schema、双语、引用与循环</tspan></text></g><g data-node-id="layout"><rect x="450" y="362" width="270" height="72" rx="12" fill="#F2F7FB" stroke="#8FB5D2" stroke-width="1.5"/><text x="585" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F"><tspan x="585" y="395">计算布局与连接线</tspan></text><text x="585" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="585" y="420">固定矩形与正交路径</tspan></text></g><g data-node-id="revise-spec"><rect x="780" y="362" width="270" height="72" rx="12" fill="#FFF7EF" stroke="#E9B37D" stroke-width="1.5"/><text x="915" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#7C2D12"><tspan x="915" y="395">返回修订 DiagramSpec</tspan></text><text x="915" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="915" y="420">闸门失败时停止发布</tspan></text></g><g data-node-id="post-layout"><rect x="615" y="472" width="270" height="72" rx="12" fill="#FFF9E8" stroke="#D4B266" stroke-width="1.5"/><text x="750" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#713F12"><tspan x="750" y="505">执行布局后检查</tspan></text><text x="750" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="750" y="530">逐对检查节点重叠</tspan></text></g><g data-node-id="assets"><rect x="450" y="582" width="270" height="72" rx="12" fill="#F7F8F9" stroke="#AAB4C0" stroke-width="1.5"/><text x="585" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#334155"><tspan x="585" y="615">写入三份图表资产</tspan></text><text x="585" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="585" y="640">Draw.io + 中文 SVG + 英文 SVG</tspan></text></g><g data-node-id="revise-layout"><rect x="780" y="582" width="270" height="72" rx="12" fill="#FFF7EF" stroke="#E9B37D" stroke-width="1.5"/><text x="915" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#7C2D12"><tspan x="915" y="615">返回修订布局参数</tspan></text><text x="915" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="915" y="640">调整层级、画布或尺寸</tspan></text></g><g data-node-id="embed"><rect x="615" y="692" width="270" height="72" rx="12" fill="#EFF9F7" stroke="#78BDB5" stroke-width="1.5"/><text x="750" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#115E59"><tspan x="750" y="725">嵌入文章与演示模式</tspan></text><text x="750" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="750" y="750">按当前语言选择 SVG</tspan></text></g><g data-node-id="visual-gate"><rect x="450" y="802" width="270" height="72" rx="12" fill="#FFF9E8" stroke="#D4B266" stroke-width="1.5"/><text x="585" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#713F12"><tspan x="585" y="835">执行浏览器视觉检查</tspan></text><text x="585" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="585" y="860">桌面、手机、亮暗主题与 PPT</tspan></text></g><g data-node-id="revise-page"><rect x="780" y="802" width="270" height="72" rx="12" fill="#FFF7EF" stroke="#E9B37D" stroke-width="1.5"/><text x="915" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#7C2D12"><tspan x="915" y="835">返回修订页面容器</tspan></text><text x="915" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="915" y="860">修复截断或导航侵入</tspan></text></g><g data-node-id="rerun-spec"><rect x="120" y="912" width="270" height="72" rx="12" fill="#F7F8F9" stroke="#AAB4C0" stroke-width="1.5"/><text x="255" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#334155"><tspan x="255" y="945">新一轮从规格校验重跑</tspan></text><text x="255" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="255" y="970">使用修订后的 DiagramSpec</tspan></text></g><g data-node-id="rerun-layout"><rect x="450" y="912" width="270" height="72" rx="12" fill="#F7F8F9" stroke="#AAB4C0" stroke-width="1.5"/><text x="585" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#334155"><tspan x="585" y="945">新一轮从布局重跑</tspan></text><text x="585" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="585" y="970">使用修订后的布局参数</tspan></text></g><g data-node-id="publish"><rect x="780" y="912" width="270" height="72" rx="12" fill="#EFF9F7" stroke="#78BDB5" stroke-width="1.5"/><text x="915" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#115E59"><tspan x="915" y="945">通过最终发布闸门</tspan></text><text x="915" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="915" y="970">文章、演示与 PPT 可发布</tspan></text></g><g data-node-id="rerun-page"><rect x="1110" y="912" width="270" height="72" rx="12" fill="#F7F8F9" stroke="#AAB4C0" stroke-width="1.5"/><text x="1245" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#334155"><tspan x="1245" y="945">新一轮从页面验收重跑</tspan></text><text x="1245" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="1245" y="970">使用修订后的页面容器</tspan></text></g></svg>
