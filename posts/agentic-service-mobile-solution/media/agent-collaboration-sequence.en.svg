text x="490" y="244" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#334155">Return Work-Order Draft and Gaps</text><line x1="362" y1="312" x2="875" y2="312" stroke="#475569" stroke-width="2" marker-end="url(#sequence-arrow)"/><rect x="528.5" y="285" width="180" height="22" rx="5" fill="#FCF8F2"/><text x="618.5" y="302" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#334155">Inspect Mutable Master Data</text><line x1="875" y1="370" x2="362" y2="370" stroke="#475569" stroke-width="2" marker-end="url(#sequence-arrow)" stroke-dasharray="7 5"/><rect x="528.5" y="343" width="180" height="22" rx="5" fill="#FCF8F2"/><text x="618.5" y="360" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#334155">Return Evidence-Backed Change Draft</text><line x1="362" y1="428" x2="1132" y2="428" stroke="#475569" stroke-width="2" marker-end="url(#sequence-arrow)"/><rect x="694.5" y="401" width="105" height="22" rx="5" fill="#FCF8F2"/><text x="747" y="418" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#334155">Read Open Tasks</text><line x1="1132" y1="486" x2="362" y2="486" stroke="#475569" stroke-width="2" marker-end="url(#sequence-arrow)" stroke-dasharray="7 5"/><rect x="657" y="459" width="180" height="22" rx="5" fill="#FCF8F2"/><text x="747" y="476" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#334155">Return Follow-Up Recommendation</text><line x1="362" y1="544" x2="105" y2="544" stroke="#475569" stroke-width="2" marker-end="url(#sequence-arrow)" stroke-dasharray="7 5"/><rect x="143.5" y="517" width="180" height="22" rx="5" fill="#FCF8F2"/><text x="233.5" y="534" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#334155">Present Three Draft Groups With Sources</text><line x1="105" y1="602" x2="362" y2="602" stroke="#475569" stroke-width="2" marker-end="url(#sequence-arrow)"/><rect x="143.5" y="575" width="180" height="22" rx="5" fill="#FCF8F2"/><text x="233.5" y="592" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#334155">Confirm, Edit, or Reject Each Group</text><line x1="362" y1="660" x2="1388" y2="660" stroke="#475569" stroke-width="2" marker-end="url(#sequence-arrow)"/><rect x="785" y="633" width="180" height="22" rx="5" fill="#FCF8F2"/><text x="875" y="650" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#334155">Submit Confirmed Change Sets</text><line x1="1388" y1="718" x2="1645" y2="718" stroke="#475569" stroke-width="2" marker-end="url(#sequence-arrow)"/><rect x="1432.5" y="691" width="168" height="22" rx="5" fill="#FCF8F2"/><text x="1516.5" y="708" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#334155">Write Work-Order Results</text><line x1="1388" y1="776" x2="1645" y2="776" stroke="#475569" stroke-width="2" marker-end="url(#sequence-arrow)"/><rect x="1426.5" y="749" width="180" height="22" rx="5" fill="#FCF8F2"/><text x="1516.5" y="766" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#334155">Create Master-Data Approval</text><line x1="1388" y1="834" x2="1645" y2="834" stroke="#475569" stroke-width="2" marker-end="url(#sequence-arrow)"/><rect x="1443" y="807" width="147" height="22" rx="5" fill="#FCF8F2"/><text x="1516.5" y="824" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#334155">Create Follow-Up Task</text><line x1="1645" y1="892" x2="1388" y2="892" stroke="#475569" stroke-width="2" marker-end="url(#sequence-arrow)" stroke-dasharray="7 5"/><rect x="1436" y="865" width="161" height="22" rx="5" fill="#FCF8F2"/><text x="1516.5" y="882" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#334155">Return Per-Group Status</text><line x1="1388" y1="950" x2="105" y2="950" stroke="#475569" stroke-width="2" marker-end="url(#sequence-arrow)" stroke-dasharray="7 5"/><rect x="656.5" y="923" width="180" height="22" rx="5" fill="#FCF8F2"/><text x="746.5" y="940" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="13" fill="#334155">Show Succeeded, Pending, or Failed</text></svg>
