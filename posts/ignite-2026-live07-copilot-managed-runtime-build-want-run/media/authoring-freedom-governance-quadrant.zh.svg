-role-accent-bar, #ea580c)"/><text x="891.5" y="136" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">Lovable / 三方工具直投 CMR</text><text x="891.5" y="153" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">从排班表到销售 CRM 简报，免重构直通生产并继承 Entra 细粒度权限</text></g><g data-point-id="cowork-studio-cmr"><circle cx="798" cy="132" r="14.5" fill="var(--fig-role-teal-fill, rgba(13, 143, 140, 0.09))" stroke="var(--fig-role-teal-stroke, rgba(13, 143, 140, 0.46))" stroke-width="1"/><circle cx="798" cy="132" r="8.5" fill="var(--fig-role-teal-bar, #0d8f8c)"/><text x="777.5" y="147" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">Cowork / Copilot Studio 托管应用</text><text x="777.5" y="164" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">自然语言生成应用与工作流，默认纳管 M365 管理中心并调用 1,500+ 连接器</text></g><g data-point-id="cli-code-cmr"><circle cx="855" cy="172" r="14.5" fill="var(--fig-role-blue-fill, rgba(37, 99, 235, 0.07))" stroke="var(--fig-role-blue-stroke, rgba(59, 130, 246, 0.42))" stroke-width="1"/><circle cx="855" cy="172" r="8.5" fill="var(--fig-role-blue-bar, #2563eb)"/><text x="834.5" y="217" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">Copilot Code / CLI + Git 源码协同</text><text x="834.5" y="234" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fi