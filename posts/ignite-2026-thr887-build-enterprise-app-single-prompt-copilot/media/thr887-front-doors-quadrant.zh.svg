0,0.05))"/><line x1="552" y1="98" x2="552" y2="426" stroke="var(--fig-axis-line, rgba(23,36,48,0.24))" stroke-width="1.35" stroke-dasharray="6 5"/><line x1="78" y1="262" x2="1026" y2="262" stroke="var(--fig-axis-line, rgba(23,36,48,0.24))" stroke-width="1.35" stroke-dasharray="6 5"/><text x="96" y="124" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="var(--fig-text-subtle, #64748b)">个人与团队流内快建区（零运维即刻共享）</text><text x="1008" y="124" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--fig-role-teal-text, #115e59)">企业级智能应用与专业接力靶心（CMR 统一底座）</text><text x="96" y="412" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="var(--fig-text-subtle, #64748b)">脱离租户治理的孤岛玩具原型（上线需推倒重写）</text><text x="1008" y="412" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--fig-role-amber-text, #78350f)">传统长周期文档移交与自建服务器运维重担</text><text x="552" y="464" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fig-text-muted, #52616d)">全栈代码掌控度与多连接器业务流程复杂度 (0 → 100)</text><g transform="translate(26,262) rotate(-90)"><text x="0" y="0" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fig-text-muted, #52616d)">创建首分钟企业治理、身份鉴权与生产就绪度 (0 → 100)</text></g><g data-point-id="ungoverned-vibe-toy"><circle cx="287" cy="347" r="14.5" fill="var(--fig-role-rose-fill, rgba(225, 29, 72, 0.08))" stroke="var(--fig-role-rose-stroke, rgba(225, 29, 72, 0.48))" stroke-width="1"/><circle cx="287" cy="347" r="8.5" fill="var(--fig-role-rose-bar, #e11d48)"/><text x="307.5" y="356" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">缺乏身份与策略护栏的外部快闪原型</text><text x="307.5" y="373" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">几分钟出界面但无企业登录与防泄漏策略，投产必须彻底重写</text></g><g data-point-id="legacy-prd-handoff"><circle cx="798" cy="334" r="14.5" fill="var(--fig-role-amber-fill, rgba(217, 119, 6, 0.09))" stroke="var(--fig-role-amber-stroke, rgba(217, 119, 6, 0.44))" stroke-width="1"/><circle cx="798" cy="334" r="8.5" fill="var(--fig-role-amber-bar, #d97706)"/><text x="777.5" y="318" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">传统需求文档移交 + 自建服务器管线</text><text x="777.5" y="335" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">耗费数小时编写需求再排期研发，基础设施与权限接入周期漫长</text></g><g data-point-id="cmr-door-cowork"><circle cx="343" cy="157" r="14.5" fill="var(--fig-role-blue-fill, rgba(37, 99, 235, 0.07))" stroke="var(--fig-role-blue-stroke, rgba(59, 130, 246, 0.42))" stroke-width="1"/><circle cx="343" cy="157" r="8.5" fill="var(--fig-role-blue-bar, #2563eb)"/><text x="363.5" y="197" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">前门一：Copilot Cowork（信息工作者）</text><text x="363.5" y="214" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">直接融合邮件、会议与文件上下文，每 2 小时自动巡检收件箱更新状态</text></g><g data-point-id="cmr-door-studio"><circle cx="780" cy="137" r="14.5" fill="var(--fig-role-teal-fill, rgba(13, 143, 140, 0.09))" stroke="var(--fig-role-teal-stroke, rgba(13, 143, 140, 0.46))" stroke-width="1"/><circle cx="780" cy="137" r="8.5" fill="var(--fig-role-teal-bar, #0d8f8c)"/><text x="759.5" y="159" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">前门二：Copilot Studio（业务流程与内联智能体）</text><text x="759.5" y="176" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">单条提示词打通内联智能体、3 张新表、GitHub 建单与 10 页手册</text></g><g data-point-id="cmr-door-cli-sdk"><circle cx="931" cy="150" r="14.5" fill="var(--fig-role-violet-fill, rgba(124, 58, 237, 0.08))" stroke="var(--fig-role-violet-stroke, rgba(139, 92, 246, 0.42))" stroke-width="1"/><circle cx="931" cy="150" r="8.5" fill="var(--fig-role-violet-bar, #7c3aed)"/><text x="910.5" y="136" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">前门三：命令行 + 开发套件（VS Code 接力）</text><text x="910.5" y="153" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">直接检视并扩展 Git 仓内标准代码，支持机械级版本回滚且免管服务器</text></g></svg>
