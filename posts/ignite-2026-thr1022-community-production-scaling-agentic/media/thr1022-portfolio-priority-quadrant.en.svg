0.11))" stroke-width="1.25"/><rect x="552" y="98" width="474" height="174" rx="14" fill="var(--fig-quadrant-tint, rgba(13,143,140,0.05))"/><line x1="552" y1="98" x2="552" y2="446" stroke="var(--fig-axis-line, rgba(23,36,48,0.24))" stroke-width="1.35" stroke-dasharray="6 5"/><line x1="78" y1="272" x2="1026" y2="272" stroke="var(--fig-axis-line, rgba(23,36,48,0.24))" stroke-width="1.35" stroke-dasharray="6 5"/><text x="96" y="124" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="var(--fig-text-subtle, #64748b)">Quick Win (Fund 3–5 w/ Rapid Baseline)</text><text x="1008" y="124" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--fig-role-teal-text, #115e59)">Strategic Investment (Fund 1–2 w/ Stage Gates)</text><text x="96" y="432" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="var(--fig-text-subtle, #64748b)">Explore (Resolve Uncertainties Before Funding)</text><text x="1008" y="432" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--fig-role-amber-text, #78350f)">Reconsider (Simplify, Combine, Defer or Stop)</text><text x="552" y="484" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fig-text-muted, #52616d)">Engineering Implementation &amp; Change Effort (Low Effort → High Effort)</text><g transform="translate(26,272) rotate(-90)"><text x="0" y="0" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fig-text-muted, #52616d)">Measurable Business Value &amp; Financial Impact (Low Impact → High Impact)</text></g><g data-point-id="quick-win-weekly-workflow"><circle cx="287" cy="161" r="14.5" fill="var(--fig-role-teal-fill, rgba(13, 143, 140, 0.09))" stroke="var(--fig-role-teal-stroke, rgba(13, 143, 140, 0.46))" stroke-width="1"/><circle cx="287" cy="161" r="8.5" fill="var(--fig-role-teal-bar, #0d8f8c)"/><text x="307.5" y="142" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">Quick Win: Weekly End-to-End Broken Workflow</text><text x="307.5" y="159" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">Fund 3–5; weekly volume, clear baseline, rapid proof for both executives &amp; staff</text></g><g data-point-id="strategic-gated-bet"><circle cx="798" cy="168" r="14.5" fill="var(--fig-role-violet-fill, rgba(124, 58, 237, 0.08))" stroke="var(--fig-role-violet-stroke, rgba(139, 92, 246, 0.42))" stroke-width="1"/><circle cx="798" cy="168" r="8.5" fill="var(--fig-role-violet-bar, #7c3aed)"/><text x="777.5" y="180" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">Strategic Investment: Cross-Org Core Workflow</text><text x="777.5" y="197" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">Fund 1–2; high effort &amp; impact, governed by stage gates and evidence milestones</text></g><g data-point-id="explore-ten-agent-brainstorm"><circle cx="324" cy="349" r="14.5" fill="var(--fig-role-amber-fill, rgba(217, 119, 6, 0.09))" stroke="var(--fig-role-amber-stroke, rgba(217, 119, 6, 0.44))" stroke-width="1"/><circle cx="324" cy="349" r="8.5" fill="var(--fig-role-amber-bar, #d97706)"/><text x="344.5" y="333" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">Explore Trap: Generic &apos;10 Agent Ideas&apos; or Quarterly Task</text><text x="344.5" y="350" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">E.g., asking for 4 Autopilots or quarterly tasks; resolve workflow fit before funding</text></g><g data-point-id="reconsider-fragmented-build"><circle cx="855" cy="362" r="14.5" fill="var(--fig-role-rose-fill, rgba(225, 29, 72, 0.08))" stroke="var(--fig-role-rose-stroke, rgba(225, 29, 72, 0.48))" stroke-width="1"/><circle cx="855" cy="362" r="8.5" fill="var(--fig-role-rose-bar, #e11d48)"/><text x="834.5" y="371" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">Reconsider: High-Effort Fragment Leaving Last 2 Steps Manual</text><text x="834.5" y="388" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">Automates middle steps across tools but leaves manual tail; simplify, defer, or stop</text></g></svg>
