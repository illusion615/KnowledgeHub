rt" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">如索要“4 个 Autopilot”或每季仅用一次；先澄清真实工作流痛点，暂不批复投产预算</text></g><g data-point-id="reconsider-fragmented-build"><circle cx="855" cy="362" r="14.5" fill="var(--fig-role-rose-fill, rgba(225, 29, 72, 0.08))" stroke="var(--fig-role-rose-stroke, rgba(225, 29, 72, 0.48))" stroke-width="1"/><circle cx="855" cy="362" r="8.5" fill="var(--fig-role-rose-bar, #e11d48)"/><text x="834.5" y="371" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">重估叫停：遗留手工尾巴的高成本碎片化试点</text><text x="834.5" y="388" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">跨多套工具却未打通最后两步，无基线无责任人；果断简化合并、延期或终止</text></g></svg>
