quadrant-tint, rgba(13,143,140,0.05))"/><line x1="552" y1="98" x2="552" y2="416" stroke="var(--fig-axis-line, rgba(23,36,48,0.24))" stroke-width="1.35" stroke-dasharray="6 5"/><line x1="78" y1="257" x2="1026" y2="257" stroke="var(--fig-axis-line, rgba(23,36,48,0.24))" stroke-width="1.35" stroke-dasharray="6 5"/><text x="96" y="124" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="var(--fig-text-subtle, #64748b)">强边界重资产 · 常驻闲置计费高</text><text x="1008" y="124" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--fig-role-teal-text, #115e59)">生产级智能体底座：强隔离 + 亚秒缩零</text><text x="96" y="402" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="var(--fig-text-subtle, #64748b)">单机原型区 · 缺乏多租户信任边界</text><text x="1008" y="402" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--fig-role-amber-text, #78350f)">高密轻量容器 · 共享内核难扛非受信代码</text><text x="552" y="454" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fig-text-muted, #52616d)">冷启动速度与突发缩零经济性 (0 → 100)</text><g transform="translate(26,257) rotate(-90)"><text x="0" y="0" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fig-text-muted, #52616d)">内核边界隔离与零密钥出站管控强度 (0 → 100)</text></g><g data-point-id="local-workstation"><circle cx="287" cy="359" r="14.5" fill="var(--fig-role-amber-fill, rgba(217, 119, 6, 0.09))" stroke="var(--fig-role-amber-stroke, rgba(217, 119, 6, 0.44))" stroke-width="1"/><circle cx="287" cy="359" r="8.5" fill="var(--fig-role-amber-bar, #d97706)"/><text x="307.5" y="355" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">本地开发机直接跑智能体</text><text x="307.5" y="372" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">整机即信任边界，凭据裸露且无法多租户扩展</text></g><g data-point-id="traditional-vm"><circle cx="268" cy="155" r="14.5" fill="var(--fig-role-blue-fill, rgba(37, 99, 235, 0.07))" stroke="var(--fig-role-blue-stroke, rgba(59, 130, 246, 0.42))" stroke-width="1"/><circle cx="268" cy="155" r="8.5" fill="var(--fig-role-blue-bar, #2563eb)"/><text x="288.5" y="151" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">传统常驻虚拟机（Dedicated VMs）</text><text x="288.5" y="168" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">内核隔离强但启动慢，99% 空闲时间仍持续烧钱</text></g><g data-point-id="shared-containers"><circle cx="817" cy="321" r="14.5" fill="var(--fig-role-rose-fill, rgba(225, 29, 72, 0.08))" stroke="var(--fig-role-rose-stroke, rgba(225, 29, 72, 0.48))" stroke-width="1"/><circle cx="817" cy="321" r="8.5" fill="var(--fig-role-rose-bar, #e11d48)"/><text x="796.5" y="317" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">共享内核标准容器（Containers）</text><text x="796.5" y="334" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">启动快密度高，但共享宿主机内核难防越权逃逸</text></g><g data-point-id="aca-dynamic-sessions"><circle cx="836" cy="200" r="14.5" fill="var(--fig-role-violet-fill, rgba(124, 58, 237, 0.08))" stroke="var(--fig-role-violet-stroke, rgba(139, 92, 246, 0.42))" stroke-width="1"/><circle cx="836" cy="200" r="8.5" fill="var(--fig-role-violet-bar, #7c3aed)"/><text x="815.5" y="196" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">前代 ACA Dynamic Sessions</text><text x="815.5" y="213" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">具备轻量隔离，但受限于固定环境难装自定义底座</text></g><g data-point-id="aca-sandboxes-ga"><circle cx="950" cy="127" r="14.5" fill="var(--fig-role-teal-fill, rgba(13, 143, 140, 0.09))" stroke="var(--fig-role-teal-stroke, rgba(13, 143, 140, 0.46))" stroke-width="1"/><circle cx="950" cy="127" r="8.5" fill="var(--fig-role-teal-bar, #0d8f8c)"/><text x="929.5" y="141" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">ACA Sandboxes 托管微虚拟机（GA）</text><text x="929.5" y="158" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">&lt;1s 启动 + 内存快照休眠零闲置费 + 沙盒外凭据注入</text></g></svg>
