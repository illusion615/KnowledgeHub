))" stroke-width="1.25"/><rect x="552" y="98" width="474" height="164" rx="14" fill="var(--fig-quadrant-tint, rgba(13,143,140,0.05))"/><line x1="552" y1="98" x2="552" y2="426" stroke="var(--fig-axis-line, rgba(23,36,48,0.24))" stroke-width="1.35" stroke-dasharray="6 5"/><line x1="78" y1="262" x2="1026" y2="262" stroke="var(--fig-axis-line, rgba(23,36,48,0.24))" stroke-width="1.35" stroke-dasharray="6 5"/><text x="96" y="124" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="var(--fig-text-subtle, #64748b)">Assistive Safe Zone (Inventory + Owner)</text><text x="1008" y="124" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--fig-role-teal-text, #115e59)">Governed Scale Zone (Release Record + Sign-Off)</text><text x="96" y="412" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="var(--fig-text-subtle, #64748b)">Low-Impact Sprawl (Unindexed Ghost Bots)</text><text x="1008" y="412" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--fig-role-amber-text, #78350f)">Chaotic Scale Hazard (Polite Refusal Only / Unproved)</text><text x="552" y="464" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fig-text-muted, #52616d)">Agent Action Authority &amp; Business Consequence (Read -&gt; Mutate -&gt; Move Money) (0 → 100)</text><g transform="translate(26,262) rotate(-90)"><text x="0" y="0" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fig-text-muted, #52616d)">Platform Boundary Enforcement, Test Evidence &amp; Named Sign-Off Rigor (0 → 100)</text></g><g data-point-id="assistive-v1"><circle cx="268" cy="190" r="14.5" fill="var(--fig-role-blue-fill, rgba(37, 99, 235, 0.07))" stroke="var(--fig-role-blue-stroke, rgba(59, 130, 246, 0.42))" stroke-width="1"/><circle cx="268" cy="190" r="8.5" fill="var(--fig-role-blue-bar, #2563eb)"/><text x="288.5" y="206" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">Tier 1 Assistive: Read-Only Procurement v1</text><text x="288.5" y="223" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">Reads status or summarizes notes; needs Agent 365 inventory + owner only</text></g><g data-point-id="prompt-only-trap"><circle cx="780" cy="347" r="14.5" fill="var(--fig-role-rose-fill, rgba(225, 29, 72, 0.08))" stroke="var(--fig-role-rose-stroke, rgba(225, 29, 72, 0.48))" stroke-width="1"/><circle cx="780" cy="347" r="8.5" fill="var(--fig-role-rose-bar, #e11d48)"/><text x="759.5" y="343" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">Anti-Pattern: Prompt-Refusal-Only Write Agent</text><text x="759.5" y="360" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">Lacks PPAC 403 block &amp; least-privilege ID; mistakes pipeline receipt for safety</text></g><g data-point-id="transactional-hold"><circle cx="666" cy="170" r="14.5" fill="var(--fig-role-amber-fill, rgba(217, 119, 6, 0.09))" stroke="var(--fig-role-amber-stroke, rgba(217, 119, 6, 0.44))" stroke-width="1"/><circle cx="666" cy="170" r="8.5" fill="var(--fig-role-amber-bar, #d97706)"/><text x="645.5" y="168" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">Tier 2 Transactional: Create + Submit (THR1004 HOLD)</text><text x="645.5" y="185" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">Proved 403 block &amp; 3/3 scope eval, held pending submit runtime &amp; target auth</text></g><g data-point-id="consequential-scale"><circle cx="912" cy="131" r="14.5" fill="var(--fig-role-teal-fill, rgba(13, 143, 140, 0.09))" stroke="var(--fig-role-teal-stroke, rgba(13, 143, 140, 0.46))" stroke-width="1"/><circle cx="912" cy="131" r="8.5" fill="var(--fig-role-teal-bar, #0d8f8c)"/><text x="891.5" y="136" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">Tier 3 Consequential: Governed Scale (State Farm 41/3,000+)</text><text x="891.5" y="153" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">Moves money or sensitive records; ships with Release Record, Approver &amp; KPI</text></g></svg>
