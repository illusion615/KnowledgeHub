<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 414" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Decide the Next Step from Validation Evidence</title><desc id="diagram-desc">flowchart diagram with 4 nodes and 3 connections</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs><path d="M 694 76 H 718 V 207 H 204 V 292" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><path d="M 694 76 H 718 V 207 H 550 V 292" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><path d="M 694 76 H 718 V 207 H 896 V 292" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><g data-node-id="evidence"><rect x="406" y="30" width="288" height="92" rx="12" fill="#FFF9E8" stroke="#D4B266" stroke-width="1.5"/><text x="550" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#713F12"><tspan x="550" y="71">Matched Tests: Safety, Quality,</tspan><tspan x="550" y="91">Benefit, Cost</tspan></text></g><g data-node-id="continue"><rect x="60" y="292" width="288" height="92" rx="12" fill="#F2F7FB" stroke="#8FB5D2" stroke-width="1.5"/><text x="204" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F"><tspan x="204" y="333">Pass with Benefit → Seek</tspan><tspan x="204" y="353">Next-Stage Approval</tspan></text></g><g data-node-id="pause"><rect x="406" y="292" width="288" height="92" rx="12" fill="#F7F8F9" stroke="#AAB4C0" stroke-width="1.5"/><text x="550" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#334155"><tspan x="550" y="333">Insufficient Evidence → Minimal</tspan><tspan x="550" y="353">Experiment Only</tspan></text></g><g data-node-id="stop"><rect x="752" y="292" width="288" height="92" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="896" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#9F1239"><tspan x="896" y="333">Unsafe, No Benefit, or Over</tspan><tspan x="896" y="353">Budget → Stop</tspan></text></g></svg>
