:rgba(255,122,0,0.15);--fig-role-accent-stroke:rgba(251,146,60,0.52);--fig-role-accent-bar:#fb923c;--fig-role-accent-text:#fed7aa;--fig-role-teal-fill:rgba(20,184,166,0.15);--fig-role-teal-stroke:rgba(45,212,191,0.5);--fig-role-teal-bar:#2dd4bf;--fig-role-teal-text:#99f6e4;--fig-role-blue-fill:rgba(59,130,246,0.15);--fig-role-blue-stroke:rgba(96,165,250,0.48);--fig-role-blue-bar:#60a5fa;--fig-role-blue-text:#bfdbfe;--fig-role-violet-fill:rgba(139,92,246,0.16);--fig-role-violet-stroke:rgba(167,139,250,0.48);--fig-role-violet-bar:#a78bfa;--fig-role-violet-text:#ddd6fe;--fig-role-amber-fill:rgba(245,158,11,0.15);--fig-role-amber-stroke:rgba(251,191,36,0.48);--fig-role-amber-bar:#fbbf24;--fig-role-amber-text:#fde68a;--fig-role-rose-fill:rgba(244,63,94,0.16);--fig-role-rose-stroke:rgba(251,113,133,0.54);--fig-role-rose-bar:#fb7185;--fig-role-rose-text:#fecdd3;--fig-role-slate-fill:rgba(148,163,184,0.12);--fig-role-slate-stroke:rgba(148,163,184,0.38);--fig-role-slate-bar:#94a3b8;--fig-role-slate-text:#e2e8f0;--fig-series-1:#fb923c;--fig-series-2:#2dd4bf;--fig-series-3:#60a5fa;--fig-series-4:#a78bfa;--fig-series-5:#fbbf24;--fig-series-6:#fb7185;}}</style><rect width="100%" height="100%" rx="20" fill="var(--fig-canvas-bg, rgba(255, 255, 255, 0.56))"/><text x="36" y="32" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="var(--fig-text-strong, #172430)">企业项目组合管理（PPM）工具演进与投资有效前沿象限（THR977）</text><text x="36" y="54" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">基于 Peter Kestenholz 现场演练：从三工具手工割裂与尾端低效堆预算，跃迁至 Dataverse 实时推演与 $37M 价值甜点</text><rect x="78" y="98" width="948" height="328" rx="16" fill="var(--fig-group-bg-2, rgba(244,248,252,0.72))" stroke="var(--fig-group-border, rgba(23,36,48,0.11))" stroke-width="1.25"/><rect x="552" y="98" width="474" height="164" rx="14" fill="var(--fig-quadrant-tint, rgba(13,143,140,0.05))"/><line x1="552" y1="98" x2="552" y2="426" stroke="var(--fig-axis-line, rgba(23,36,48,0.24))" stroke-width="1.35" stroke-dasharray="6 5"/><line x1="78" y1="262" x2="1026" y2="262" stroke="var(--fig-axis-line, rgba(23,36,48,0.24))" stroke-width="1.35" stroke-dasharray="6 5"/><text x="96" y="124" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="var(--fig-text-subtle, #64748b)">受控静态基线区（安全合规但缺乏动态推演）</text><text x="1008" y="124" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--fig-role-teal-text, #115e59)">推理型组合决策靶心（前沿甜点 + 本云双模 AI）</text><text x="96" y="412" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="var(--fig-text-subtle, #64748b)">传统手工割裂陷阱（导出表格重做与滞后汇报）</text><text x="1008" y="412" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--fig-role-amber-text, #78350f)">盲目满额堆砌与单云强绑区（边际收益递减）</text><text x="552" y="464" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fig-text-muted, #52616d)">多约束实时推演速度与 AI 推理深度 (0 → 100)</text><g transform="translate(26,262) rotate(-90)"><text x="0" y="0" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fig-text-muted, #52616d)">资本配置价值回报率与数据主权安全度 (0 → 100)</text></g><g data-point-id="legacy-three-tool-loop"><circle cx="249" cy="354" r="14.5" fill="var(--fig-role-rose-fill, rgba(225, 29, 72, 0.08))" stroke="var(--fig-role-rose-stroke, rgba(225, 29, 72, 0.48))" stroke-width="1"/><circle cx="249" cy="354" r="8.5" fill="var(--fig-role-rose-bar, #e11d48)"/><text x="269.5" y="363" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">传统三工具割裂循环（Power BI + Excel + PPT）</text><text x="269.5" y="380" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">只读看数、导出离线试算、手工重绘简报，面对关税与汇率波动每周推倒重来</text></g><g data-point-id="unconstrained-163m-all-in"><circle cx="723" cy="341" r="14.5" fill="var(--fig-role-amber-fill, rgba(217, 119, 6, 0.09))" stroke="var(--fig-role-amber-stroke, rgba(217, 119, 6, 0.44))" stroke-width="1"/><circle cx="723" cy="341" r="8.5" fill="var(--fig-role-amber-bar, #d97706)"/><text x="702.5" y="325" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">全量照单全收方案（$163.7M 追逐尾端低效项目）</text><text x="702.5" y="342" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">多砸 $126.7M 仅换取剩余不足一半价值，且触发 DevOps 400% 等 6 类角色过载</text></g><g data-point-id="standard-model-driven-ppm"><circle cx="324" cy="177" r="14.5" fill="var(--fig-role-blue-fill, rgba(37, 99, 235, 0.07))" stroke="var(--fig-role-blue-stroke, rgba(59, 130, 246, 0.42))" stroke-width="1"/><circle cx="324" cy="177" r="8.5" fill="var(--fig-role-blue-bar, #2563eb)"/><text x="344.5" y="180" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">传统模型驱动基线管理（Dataverse + 标准视图）</text><text x="344.5" y="197" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">具备完善行级权限与预算甘特记录，但在只读报表中难以平移排期模拟冲击</text></g><g data-point-id="cloud-only-single-agent"><circle cx="780" cy="216" r="14.5" fill="var(--fig-role-violet-fill, rgba(124, 58, 237, 0.08))" stroke="var(--fig-role-violet-stroke, rgba(139, 92, 246, 0.42))" stroke-width="1"/><circle cx="780" cy="216" r="8.5" fill="var(--fig-role-violet-bar, #7c3aed)"/><text x="759.5" y="216" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">单一云端智能体强绑定方案</text><text x="759.5" y="233" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">能快速总结场景但难以满足欧洲药企“核心组合数据不出本机”与多模型自由切换诉求</text></g><g data-point-id="xpm-reasoning-sweetspot"><circle cx="912" cy="137" r="14.5" fill="var(--fig-role-teal-fill, rgba(13, 143, 140, 0.09))" stroke="var(--fig-role-teal-stroke, rgba(13, 143, 140, 0.46))" stroke-width="1"/><circle cx="912" cy="137" r="8.5" fill="var(--fig-role-teal-bar, #0d8f8c)"/><text x="891.5" y="142" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">xPM 引导式推演引擎（$37M 甜点 + 本地/云双模 AI）</text><text x="891.5" y="159" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">2 人 3 周 38 次发布上线：千级项目秒级试算、0.5 秒直出 PPT、LM Studio 断网评审</text></g></svg>
