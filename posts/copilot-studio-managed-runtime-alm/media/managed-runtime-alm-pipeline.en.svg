<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 658" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Dual-Track Enterprise ALM Promotion Pipeline for CMR Apps and New Agents</title><desc id="diagram-desc">architecture diagram with 9 nodes and 6 connections</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs><g data-group-id="track-cmr"><rect x="40" y="24" width="1440" height="186" rx="18" fill="#FFF9F3" stroke="#DED2C3" stroke-width="2"/><line x1="40" y1="72" x2="1480" y2="72" stroke="#DED2C3" stroke-width="1.5"/><text x="58" y="55" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#7C2D12">Track A: Copilot Managed Runtime Apps Git-Native &amp; CI/CD Promotion (@microsoft/cmr-cli)</text></g><g data-group-id="track-agent"><rect x="40" y="236" width="1440" height="186" rx="18" fill="#F7FAFC" stroke="#CAD7E2" stroke-width="2"/><line x1="40" y1="284" x2="1480" y2="284" stroke="#CAD7E2" stroke-width="1.5"/><text x="58" y="267" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">Track B: Microsoft Copilot Harness Agents Declarative &amp; Solution Promotion (msagent CLI)</text></g><g data-group-id="track-gov"><rect x="40" y="448" width="1440" height="186" rx="18" fill="#FAF8FC" stroke="#D8CEE5" stroke-width="2"/><line x1="40" y1="496" x2="1480" y2="496" stroke="#D8CEE5" stroke-width="1.5"/><text x="58" y="479" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#4C1D95">Cross-Environment Isolation &amp; Dual-Admin Governance Gates (MAC + PPAC)</text></g><path d="M 451 140 H 605" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="528" y="132" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">Decouple Connections</text><path d="M 915 140 H 1069" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="992" y="132" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">Pack &amp; Validate</text><path d="M 451 352 H 605" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="528" y="344" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">Declare Target Envs</text><path d="M 915 352 H 1069" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="992" y="344" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">Evaluate &amp; Promote</text><path d="M 296 518 V 352 H 1224 V 186" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="1238" y="344" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">Headless SPN Auth</text><path d="M 1224 186 V 329 H 1224 V 518" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="1238" y="321" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">Live Host &amp; Telemetry</text><g data-node-id="cmr-extract"><rect x="141" y="94" width="310" height="92" rx="12" fill="#FFF7EF" stroke="#E9B37D" stroke-width="1.5"/><text x="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#7C2D12"><tspan x="296" y="117">1. Clone from Personal Env or BYOB</tspan><tspan x="296" y="137">Init</tspan></text><text x="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="296" y="158">ms app clone --app &lt;id&gt;, then ms app create</tspan><tspan x="296" y="173">--repo none --environment-id &lt;target&gt;</tspan></text></g><g data-node-id="cmr-overlay"><rect x="605" y="94" width="310" height="92" rx="12" fill="#FFF9E8" stroke="#D4B266" stroke-width="1.5"/><text x="760" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#713F12"><tspan x="760" y="117">2. Stage Overlay &amp; Shared Policy</tspan><tspan x="760" y="137">Gate</tspan></text><text x="760" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="760" y="158">Configure ms.&lt;stage&gt;.config.json deltas; validate</tspan><tspan x="760" y="173">allowedActions on shared connections</tspan></text></g><g data-node-id="cmr-ci"><rect x="1069" y="94" width="310" height="92" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="1224" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#9F1239"><tspan x="1224" y="127">3. GitHub Actions SPN Pack &amp; Deploy</tspan></text><text x="1224" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="1224" y="148">Enable AllowExternalArtifactDeployment; run</tspan><tspan x="1224" y="163">ms-app-pack and ms-app-deploy via SPN</tspan></text></g><g data-node-id="agent-clone"><rect x="141" y="306" width="310" height="92" rx="12" fill="#FFF7EF" stroke="#E9B37D" stroke-width="1.5"/><text x="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#7C2D12"><tspan x="296" y="339">1. msagent Clone &amp; Git Source Control</tspan></text><text x="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="296" y="360">Pull settings.mcs.yml &amp; workflows; exclude</tspan><tspan x="296" y="375">.mcs/ and .config/agent.config.json in .gitignore</tspan></text></g><g data-node-id="agent-slot"><rect x="605" y="306" width="310" height="92" rx="12" fill="#FFF9E8" stroke="#D4B266" stroke-width="1.5"/><text x="760" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#713F12"><tspan x="760" y="329">2. Multi-Stage Slots &amp; Connection</tspan><tspan x="760" y="349">Binding</tspan></text><text x="760" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="760" y="370">Register dev/test/prod targets; bind target</tspan><tspan x="760" y="385">connections via connection update</tspan></text></g><g data-node-id="agent-promote"><rect x="1069" y="306" width="310" height="92" rx="12" fill="#F2F7FB" stroke="#8FB5D2" stroke-width="1.5"/><text x="1224" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F"><tspan x="1224" y="339">3. Cloud Evaluation Gate &amp; Publish</tspan></text><text x="1224" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="1224" y="360">msagent agent deploy draft -&gt; agent eval run -&gt;</tspan><tspan x="1224" y="375">--publish (or Dataverse Solution pipeline)</tspan></text></g><g data-node-id="gov-spn"><rect x="141" y="518" width="310" height="92" rx="12" fill="#F8F4FC" stroke="#B9A3D5" stroke-width="1.5"/><text x="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#4C1D95"><tspan x="296" y="541">BAP API / Dataverse SPN</tspan><tspan x="296" y="561">Authorization</tspan></text><text x="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="296" y="582">Non-Dataverse envs grant EnvironmentAdmin via</tspan><tspan x="296" y="597">BAP API using Enterprise App Object ID</tspan></text></g><g data-node-id="gov-policy"><rect x="605" y="518" width="310" height="92" rx="12" fill="#FFF9E8" stroke="#D4B266" stroke-width="1.5"/><text x="760" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#713F12"><tspan x="760" y="541">Environment Group, ACP &amp; CSP</tspan><tspan x="760" y="561">Sandbox</tspan></text><text x="760" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="760" y="582">Allows 19 first-party Entra connectors, blocks</tspan><tspan x="760" y="597">open HTTP actions, enforces iframe CSP</tspan></text></g><g data-node-id="gov-audit"><rect x="1069" y="518" width="310" height="92" rx="12" fill="#EFF9F7" stroke="#78BDB5" stroke-width="1.5"/><text x="1224" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#115E59"><tspan x="1224" y="541">Purview Audit (519) &amp; Owner</tspan><tspan x="1224" y="561">Handover</tspan></text><text x="1224" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="1224" y="582">Track RecordType 519 &amp; P75 latency; run ms</tspan><tspan x="1224" y="597">admin add owner for offboarding handover</tspan></text></g></svg>
