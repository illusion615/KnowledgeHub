inkMacSystemFont, sans-serif" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">默认磁贴创建的托管应用</text><text x="326.5" y="340" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">强制落入个人环境，所有者离职易断档</text></g><g data-point-id="routed-personal-agent"><circle cx="249" cy="371" r="14.5" fill="var(--fig-role-amber-fill, rgba(217, 119, 6, 0.09))" stroke="var(--fig-role-amber-stroke, rgba(217, 119, 6, 0.44))" stroke-width="1"/><circle cx="249" cy="371" r="8.5" fill="var(--fig-role-amber-bar, #d97706)"/><text x="269.5" y="367" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">落入个人环境的智能体</text><text x="269.5" y="384" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">注入 Dataverse 并触发 60+15 天休眠删除</text></g><g data-point-id="classic-solution"><circle cx="249" cy="174" r="14.5" fill="var(--fig-role-blue-fill, rgba(37, 99, 235, 0.07))" stroke="var(--fig-role-blue-stroke, rgba(59, 130, 246, 0.42))" stroke-width="1"/><circle cx="249" cy="174" r="8.5" fill="var(--fig-role-blue-bar, #2563eb)"/><text x="269.5" y="170" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">传统画布应用与托管解决方案</text><text x="269.5" y="187" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">PPAC 权限成熟，但二进制包难做细粒度 Diff</text></g><g data-point-id="msagent-slots"><circle cx="893" cy="212" r="14.5" fill="var(--fig-role-violet-fill, rgba(