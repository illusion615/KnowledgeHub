<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 658" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Copilot Studio 双环境错觉：UI 顶栏环境上下文与个人环境路由的脱钩解剖</title><desc id="diagram-desc">architecture diagram with 9 nodes and 6 connections</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs><g data-group-id="authoring-plane"><rect x="40" y="24" width="1440" height="186" rx="18" fill="#FFF9F3" stroke="#DED2C3" stroke-width="2"/><line x1="40" y1="72" x2="1480" y2="72" stroke="#DED2C3" stroke-width="1.5"/><text x="58" y="55" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#7C2D12">1. 入口层与界面顶栏假象（Authoring Entry &amp; UI Context）</text></g><g data-group-id="routing-plane"><rect x="40" y="236" width="1440" height="186" rx="18" fill="#F7FAFC" stroke="#CAD7E2" stroke-width="2"/><line x1="40" y1="284" x2="1480" y2="284" stroke="#CAD7E2" stroke-width="1.5"/><text x="58" y="267" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">2. 路由与控制平面分流（Routing &amp; Control Plane Split）</text></g><g data-group-id="storage-plane"><rect x="40" y="448" width="1440" height="186" rx="18" fill="#FAF8FC" stroke="#D8CEE5" stroke-width="2"/><line x1="40" y1="496" x2="1480" y2="496" stroke="#D8CEE5" stroke-width="1.5"/><text x="58" y="479" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#4C1D95">3. 真实资产落盘与托管运行平面（Storage &amp; Hosting Data Plane）</text></g><path d="M 296 186 V 329 H 296 V 518" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="310" y="321" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">界面停留与构建计费归属</text><path d="M 760 186 V 223 H 296 V 306" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="310" y="215" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">解析登录令牌</text><path d="M 760 186 V 223 H 760 V 306" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="774" y="215" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">默认无视顶栏环境</text><path d="M 760 398 V 435 H 760 V 518" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="774" y="427" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">自动创建/复用个人环境</text><path d="M 1224 186 V 223 H 1224 V 306" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="1238" y="215" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">检查环境上下文</text><path d="M 1224 398 V 435 H 1224 V 518" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="1238" y="427" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">写入当前激活环境 Solution</text><g data-node-id="ui-picker"><rect x="141" y="94" width="310" height="92" rx="12" fill="#EFF9F7" stroke="#78BDB5" stroke-width="1.5"/><text x="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#115E59"><tspan x="296" y="127">Copilot Studio 顶栏环境选择器</tspan></text><text x="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="296" y="148">显示用户手动选择的 Team-Dev；仅约束会话级</tspan><tspan x="296" y="163">Agents/Flows 列表</tspan></text></g><g data-node-id="app-tile"><rect x="605" y="94" width="310" height="92" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="760" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#9F1239"><tspan x="760" y="117">New Experience: Apps / ms app</tspan><tspan x="760" y="137">create</tspan></text><text x="760" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="760" y="158">Copilot Studio App 磁贴、Cowork、Copilot Code</tspan><tspan x="760" y="173">或 ms CLI</tspan></text></g><g data-node-id="agent-tile"><rect x="1069" y="94" width="310" height="92" rx="12" fill="#FFF7EF" stroke="#E9B37D" stroke-width="1.5"/><text x="1224" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#7C2D12"><tspan x="1224" y="127">Agents / Workflows 创建入口</tspan></text><text x="1224" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="1224" y="148">Microsoft Copilot / Customer Conversation /</tspan><tspan x="1224" y="163">Standard Harness</tspan></text></g><g data-node-id="token-geo"><rect x="141" y="306" width="310" height="92" rx="12" fill="#FFF9E8" stroke="#D4B266" stroke-width="1.5"/><text x="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#713F12"><tspan x="296" y="339">Entra Token 构建期地理路由</tspan></text><text x="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="296" y="360">按 PDL &gt; 2字母 Country &gt; 租户国家决定构建数据区</tspan><tspan x="296" y="375">（忽略顶栏环境）</tspan></text></g><g data-node-id="cmr-routing"><rect x="605" y="306" width="310" height="92" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="760" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#9F1239"><tspan x="760" y="339">CMR 强制环境路由（租户级不可关）</tspan></text><text x="760" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="760" y="360">忽略顶栏选择器，按 Everyone / 安全组规则强制导</tspan><tspan x="760" y="375">向个人环境</tspan></text></g><g data-node-id="ppac-routing"><rect x="1069" y="306" width="310" height="92" rx="12" fill="#FFF9E8" stroke="#D4B266" stroke-width="1.5"/><text x="1224" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#713F12"><tspan x="1224" y="339">PPAC 产品级环境路由判定</tspan></text><text x="1224" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="1224" y="360">若开启 Copilot Studio 路由则初次跳个人环境；支持</tspan><tspan x="1224" y="375">手动切回目标环境</tspan></text></g><g data-node-id="build-credit"><rect x="141" y="518" width="310" height="92" rx="12" fill="#F8F4FC" stroke="#B9A3D5" stroke-width="1.5"/><text x="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#4C1D95"><tspan x="296" y="551">构建期计费与对话暂存</tspan></text><text x="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="296" y="572">Copilot Studio 环境计费池扣减构建 Credits；对话落</tspan><tspan x="296" y="587">盘于 Maker 地理区</tspan></text></g><g data-node-id="personal-env"><rect x="605" y="518" width="310" height="92" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="760" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#9F1239"><tspan x="760" y="551">Maker 专属个人环境（托管环境）</tspan></text><text x="760" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="760" y="572">初始无 Dataverse；承载 CMR App、平台 Git 仓、</tspan><tspan x="760" y="587">ms.config.json</tspan></text></g><g data-node-id="target-dataverse"><rect x="1069" y="518" width="310" height="92" rx="12" fill="#F2F7FB" stroke="#8FB5D2" stroke-width="1.5"/><text x="1224" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F"><tspan x="1224" y="551">所选环境 Dataverse Solutions</tspan></text><text x="1224" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="1224" y="572">承载 Agent (bot / botcomponent) 与 Workflow；含</tspan><tspan x="1224" y="587">Dataverse 库时受 60+15 天清理约束</tspan></text></g></svg>
