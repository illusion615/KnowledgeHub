<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 658" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Copilot Managed Runtime 应用与 New Agent 企业级双轨 ALM 晋升流水线</title><desc id="diagram-desc">architecture diagram with 9 nodes and 6 connections</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs><g data-group-id="track-cmr"><rect x="40" y="24" width="1440" height="186" rx="18" fill="#FFF9F3" stroke="#DED2C3" stroke-width="2"/><line x1="40" y1="72" x2="1480" y2="72" stroke="#DED2C3" stroke-width="1.5"/><text x="58" y="55" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#7C2D12">轨道 A：Copilot Managed Runtime Apps 代码级 Git / CI/CD 晋升轨（@microsoft/cmr-cli）</text></g><g data-group-id="track-agent"><rect x="40" y="236" width="1440" height="186" rx="18" fill="#F7FAFC" stroke="#CAD7E2" stroke-width="2"/><line x1="40" y1="284" x2="1480" y2="284" stroke="#CAD7E2" stroke-width="1.5"/><text x="58" y="267" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">轨道 B：Microsoft Copilot Harness Agents 声明式定义与 Solution 晋升轨（msagent CLI）</text></g><g data-group-id="track-gov"><rect x="40" y="448" width="1440" height="186" rx="18" fill="#FAF8FC" stroke="#D8CEE5" stroke-width="2"/><line x1="40" y1="496" x2="1480" y2="496" stroke="#D8CEE5" stroke-width="1.5"/><text x="58" y="479" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#4C1D95">跨环境配置隔离与双管理中心安全门禁（MAC + PPAC Governance Gates）</text></g><path d="M 451 140 H 605" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="528" y="132" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">解耦环境连接</text><path d="M 915 140 H 1069" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="992" y="132" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">构建并校验策略</text><path d="M 451 352 H 605" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="528" y="344" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">声明目标环境</text><path d="M 915 352 H 1069" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="992" y="344" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">草稿评测与晋升</text><path d="M 296 518 V 352 H 1224 V 186" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="1238" y="344" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">提供免人工凭证</text><path d="M 1224 186 V 329 H 1224 V 518" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="1238" y="321" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">托管上线与遥测</text><g data-node-id="cmr-extract"><rect x="141" y="94" width="310" height="92" rx="12" fill="#FFF7EF" stroke="#E9B37D" stroke-width="1.5"/><text x="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#7C2D12"><tspan x="296" y="119.5">1. 从个人环境克隆或 BYOB 初始化</tspan></text><text x="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="296" y="140.5">ms app clone --app &lt;id&gt; 提取源码，并在目标环境执</tspan><tspan x="296" y="155.5">行 ms app create --repo none --environment-id</tspan><tspan x="296" y="170.5">&lt;target&gt;</tspan></text></g><g data-node-id="cmr-overlay"><rect x="605" y="94" width="310" height="92" rx="12" fill="#FFF9E8" stroke="#D4B266" stroke-width="1.5"/><text x="760" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#713F12"><tspan x="760" y="127">2. Stage Overlay 与共享连接校验</tspan></text><text x="760" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="760" y="148">配置 ms.&lt;stage&gt;.config.json 覆盖连接与表；校验</tspan><tspan x="760" y="163">sharedConnectionId 的 allowedActions</tspan></text></g><g data-node-id="cmr-ci"><rect x="1069" y="94" width="310" height="92" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="1224" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#9F1239"><tspan x="1224" y="127">3. GitHub Actions SPN 打包与发布</tspan></text><text x="1224" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="1224" y="148">开启 AllowExternalArtifactDeployment；通过</tspan><tspan x="1224" y="163">ms-app-pack 与 ms-app-deploy 自动上线</tspan></text></g><g data-node-id="agent-clone"><rect x="141" y="306" width="310" height="92" rx="12" fill="#FFF7EF" stroke="#E9B37D" stroke-width="1.5"/><text x="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#7C2D12"><tspan x="296" y="339">1. msagent 克隆定义与 Git 纳管</tspan></text><text x="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="296" y="360">拉取 settings.mcs.yml 与 workflows；将 .mcs/</tspan><tspan x="296" y="375">与 .config/agent.config.json 加入 .gitignore</tspan></text></g><g data-node-id="agent-slot"><rect x="605" y="306" width="310" height="92" rx="12" fill="#FFF9E8" stroke="#D4B266" stroke-width="1.5"/><text x="760" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#713F12"><tspan x="760" y="339">2. 多环境部署槽位与连接绑定</tspan></text><text x="760" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="760" y="360">msagent deployment create 注册 dev/test/prod；</tspan><tspan x="760" y="375">按引用名执行 connection update</tspan></text></g><g data-node-id="agent-promote"><rect x="1069" y="306" width="310" height="92" rx="12" fill="#F2F7FB" stroke="#8FB5D2" stroke-width="1.5"/><text x="1224" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F"><tspan x="1224" y="339">3. 云端评测门禁与正式发布</tspan></text><text x="1224" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="1224" y="360">msagent agent deploy 推送草稿 -&gt; agent eval run</tspan><tspan x="1224" y="375">评测 -&gt; --publish 发布（或走 Solution 管道）</tspan></text></g><g data-node-id="gov-spn"><rect x="141" y="518" width="310" height="92" rx="12" fill="#F8F4FC" stroke="#B9A3D5" stroke-width="1.5"/><text x="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#4C1D95"><tspan x="296" y="543.5">BAP API / Dataverse SPN 授权</tspan></text><text x="296" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="296" y="564.5">无 Dataverse 环境通过 BAP API 赋权</tspan><tspan x="296" y="579.5">EnvironmentAdmin（必须用 Enterprise App</tspan><tspan x="296" y="594.5">Object ID）</tspan></text></g><g data-node-id="gov-policy"><rect x="605" y="518" width="310" height="92" rx="12" fill="#FFF9E8" stroke="#D4B266" stroke-width="1.5"/><text x="760" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#713F12"><tspan x="760" y="551">环境组策略、ACP 与 CSP 沙盒</tspan></text><text x="760" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="760" y="572">默认放行 19 个 Entra 认证一等连接器并拦截任意</tspan><tspan x="760" y="587">HTTP 动作；强制 iframe CSP</tspan></text></g><g data-node-id="gov-audit"><rect x="1069" y="518" width="310" height="92" rx="12" fill="#EFF9F7" stroke="#78BDB5" stroke-width="1.5"/><text x="1224" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#115E59"><tspan x="1224" y="551">Purview 审计 (519) 与离职接管</tspan></text><text x="1224" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="1224" y="572">监控 RecordType 519 与 P75 延迟；通过 ms</tspan><tspan x="1224" y="587">admin add owner 移交源码与环境</tspan></text></g></svg>
