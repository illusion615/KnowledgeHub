"/><text x="480" y="184" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" class="sr-figure-num" font-size="12" font-weight="700" fill="var(--fig-text-strong, #172430)">2.6×（1,279 → 峰值 3,312 人/月）</text><text x="271" y="241" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13" font-weight="600" fill="var(--fig-text-strong, #172430)">模型驱动应用（Model-Driven）增速</text><rect x="285" y="225" width="96" height="24" rx="6" fill="var(--fig-role-violet-bar, #7c3aed)" fill-opacity="0.88"/><text x="391" y="242" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" class="sr-figure-num" font-size="12" font-weight="700" fill="var(--fig-text-strong, #172430)">1.35×（达 2,375 个，净增 +35%）</text><text x="271" y="299" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13" font-weight="600" fill="var(--fig-text-strong, #172430)">Power Apps 应用总量规模比</text><rect x="285" y="283" width="83" height="24" rx="6" fill="var(--fig-role-blue-bar, #2563eb)" fill-opacity="0.88"/><text x="378" y="300" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" class="sr-figure-num" font-size="12" font-weight="700" fill="var(--fig-text-strong, #172430)">1.17×（23,804 → 27,862 个应用）</text><text x="271" y="357" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13" font-weight="600" fill="var(--fig-text-strong, #172430)">画布与门户（Canvas &amp; Pages）规模比</text><rect x="285" y="341" width="82" height="24" rx="6" fill="var(--fig-role-amber-bar, #d97706)" fill-opacity="0.88"/><text x="377" y="358" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" class="sr-figure-num" font-size="12" font-weight="700" fill="var(--fig-text-strong, #172430)">1.15×（达 25,437 个 + 50 新代码应用）</text><text x=