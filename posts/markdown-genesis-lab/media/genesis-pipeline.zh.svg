  </defs>
  <rect width="880" height="260" rx="20" fill="url(#bgGradZh)" stroke="#d8e2dc" stroke-width="1.5" />
  <g font-family="Noto Sans SC, Space Grotesk, sans-serif">
    <rect x="34" y="54" width="210" height="152" rx="16" fill="#ffffff" stroke="#ff7a00" stroke-width="2" />
    <text x="54" y="88" font-size="13" font-weight="700" fill="#ff7a00">01 / SOURCE OF TRUTH</text>
    <text x="54" y="118" font-size="18" font-weight="800" fill="#172430">article.md 唯一真源</text>
    <text x="54" y="146" font-size="13" fill="#5d6c76">YAML Frontmatter + 9 类指令</text>
    <text x="54" y="170" font-size="13" fill="#5d6c76">数学公式 + 双语图表 + 沙盒插槽</text>

    <path d="M254 130 L314 130" stroke="#0d8f8c" stroke-width="3" stroke-linecap="round" />
    <polygon points="314,124 328,130 314,136" fill="#0d8f8c" />

    <rect x="336" y="54" width="210" height="152" rx="16" fill="url(#tealGradZh)" />
    <text x="356" y="88" font-size="13" font-weight="700" fill="#d1fae5">02 / COMPILER KERNEL</text>
    <text x="356" y="118" font-size="18" font-weight="800" fill="#ffffff">markdown-it 编译内核</text>
    <text x="356" y="146" font-size="13" fill="#ecfdf5">毫秒级确定性 AST 转换</text>
