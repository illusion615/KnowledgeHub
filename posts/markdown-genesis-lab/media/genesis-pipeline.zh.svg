    <rect x="638" y="54" width="208" height="152" rx="16" fill="#101f2b" />
    <text x="658" y="88" font-size="13" font-weight="700" fill="#ff9340">03 / GITHUB PAGES</text>
    <text x="658" y="118" font-size="18" font-weight="800" fill="#ffffff">纯静态自包含 HTML</text>
    <text x="658" y="146" font-size="13" fill="#cbd5e1">零后端服务依赖开箱即用</text>
