      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="100%" stop-color="#f0f7f6" />
    </linearGradient>
    <linearGradient id="accentGradZh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#ff9340" />
    </linearGradient>
    <linearGradient id="tealGradZh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d8f8c" />
