<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Copilot Studio D2E Streaming Gateway System Architecture</title><desc id="diagram-desc">architecture diagram with 9 nodes and 9 connections</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs><g data-group-id="customer-domain"><rect x="40" y="24" width="1520" height="182" rx="18" fill="#FFF9F3" stroke="#DED2C3" stroke-width="2"/><line x1="40" y1="72" x2="1560" y2="72" stroke="#DED2C3" stroke-width="1.5"/><text x="58" y="55" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#7C2D12">Customer / Third-Party Systems (Outside Solution Boundary)</text></g><g data-group-id="gateway-domain"><rect x="40" y="234" width="1520" height="182" rx="18" fill="#F7FAFC" stroke="#CAD7E2" stroke-width="2"/><line x1="40" y1="282" x2="1560" y2="282" stroke="#CAD7E2" stroke-width="1.5"/><text x="58" y="265" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">Azure D2E Streaming Gateway (Solution Deployment Boundary)</text></g><g data-group-id="microsoft-domain"><rect x="40" y="444" width="1520" height="182" rx="18" fill="#FAF8FC" stroke="#D8CEE5" stroke-width="2"/><line x1="40" y1="492" x2="1560" y2="492" stroke="#D8CEE5" stroke-width="1.5"/><text x="58" y="475" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#4C1D95">Microsoft Platform Domain (Existing Components Outside the Boundary)</text></g><path d="M 800 182 V 244 H 211 V 306" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="225" y="236" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">Optional APIM Path</text><path d="M 800 182 V 244 H 506 V 306" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="520" y="236" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">Direct HTTPS / SSE</text><path d="M 351 349 H 366" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><path d="M 646 349 H 1249" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="1263" y="341" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">Mapping / ETag / TTL</text><path d="M 646 349 H 660" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><path d="M 940 349 H 954" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1094 392 V 454 H 309 V 516" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="323" y="446" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">Token Refresh / Re-Sign-In</text><path d="M 800 392 V 454 H 800 V 516" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="814" y="446" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">D2E POST / Activity SSE</text><path d="M 940 559 H 1151" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="1165" y="551" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">Invoke Published Agent</text><g data-node-id="customer-app"><rect x="660" y="96" width="280" height="86" rx="12" fill="#F2F7FB" stroke="#8FB5D2" stroke-width="1.5"/><text x="800" y="129" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">Customer-Owned App</text><text x="800" y="154" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B">Web / Mobile / Backend; Carries Selected Credential</text></g><g data-node-id="edge-api"><rect x="71" y="306" width="280" height="86" rx="12" fill="#F8F4FC" stroke="#B9A3D5" stroke-width="1.5"/><text x="211" y="339" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#4C1D95">Azure API Management</text><text x="211" y="364" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B">Optional Edge: Auth Policy, Limits, No SSE Buffer</text></g><g data-node-id="conversation-runtime"><rect x="366" y="306" width="280" height="86" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="506" y="339" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#9F1239">Streaming API Runtime</text><text x="506" y="364" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B">Access Control, Limits, Cancel; Two Output Modes</text></g><g data-node-id="session-store"><rect x="1249" y="306" width="280" height="86" rx="12" fill="#FFF9E8" stroke="#D4B266" stroke-width="1.5"/><text x="1389" y="339" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#713F12">Conversation State Store</text><text x="1389" y="364" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B">Opaque ID Mapping, ETag, TTL, Turn Lock</text></g><g data-node-id="d2e-adapter"><rect x="660" y="306" width="280" height="86" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="800" y="339" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#9F1239">D2E Streaming Adapter</text><text x="800" y="364" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B">Single Frame Path: D2E POST, Activity SSE</text></g><g data-node-id="identity-cache"><rect x="954" y="306" width="280" height="86" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="1094" y="339" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#9F1239">Dedicated Delegated Identity</text><text x="1094" y="364" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B">Dedicated User + Encrypted MSAL Cache</text></g><g data-node-id="entra-id"><rect x="169" y="516" width="280" height="86" rx="12" fill="#F2F7FB" stroke="#8FB5D2" stroke-width="1.5"/><text x="309" y="549" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">Microsoft Entra ID</text><text x="309" y="574" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B">Issues Delegated Tokens for Power Platform</text></g><g data-node-id="d2e-runtime"><rect x="660" y="516" width="280" height="86" rx="12" fill="#F2F7FB" stroke="#8FB5D2" stroke-width="1.5"/><text x="800" y="549" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">Power Platform D2E</text><text x="800" y="574" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B">Validates Delegated Identity, Returns Activity SSE</text></g><g data-node-id="anonymous-agent"><rect x="1151" y="516" width="280" height="86" rx="12" fill="#F2F7FB" stroke="#8FB5D2" stroke-width="1.5"/><text x="1291" y="549" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">Published No Authentication Agent</text><text x="1291" y="574" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B">Requires No End-User Entra Sign-In</text></g></svg>
