<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 804" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Copilot Studio D2E Streaming Gateway 系统架构</title><desc id="diagram-desc">architecture diagram with 9 nodes and 9 connections</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs><g data-group-id="customer-domain"><rect x="40" y="24" width="1520" height="192" rx="18" fill="#FFF9F3" stroke="#DED2C3" stroke-width="2"/><line x1="40" y1="72" x2="1560" y2="72" stroke="#DED2C3" stroke-width="1.5"/><text x="58" y="55" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#7C2D12">客户 / 第三方系统（方案边界外）</text></g><g data-group-id="gateway-domain"><rect x="40" y="244" width="1520" height="316" rx="18" fill="#F7FAFC" stroke="#CAD7E2" stroke-width="2"/><line x1="40" y1="292" x2="1560" y2="292" stroke="#CAD7E2" stroke-width="1.5"/><text x="58" y="275" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">Azure D2E Streaming Gateway（方案部署边界）</text></g><g data-group-id="microsoft-domain"><rect x="40" y="588" width="1520" height="192" rx="18" fill="#FAF8FC" stroke="#D8CEE5" stroke-width="2"/><line x1="40" y1="636" x2="1560" y2="636" stroke="#D8CEE5" stroke-width="1.5"/><text x="58" y="619" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#4C1D95">Microsoft 平台域（边界外既有组件）</text></g><path d="M 800 192 V 230 H 309 V 316" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="323" y="222" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">可选 APIM 路径</text><path d="M 800 192 V 230 H 800 V 316" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="814" y="222" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">直连 HTTPS / SSE</text><path d="M 449 364 H 660" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><path d="M 800 412 V 440" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="814" y="430" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">会话映射 / ETag / TTL</text><path d="M 940 364 H 1151" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1291 412 V 440" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1291 536 V 574 H 309 V 660" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="323" y="566" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">token 刷新 / 重新登录</text><path d="M 1431 364 H 1455 V 574 H 800 V 660" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="814" y="566" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">D2E POST / Activity SSE</text><path d="M 940 708 H 1151" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="1046" y="700" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">调用已发布 Agent</text><g data-node-id="customer-app"><rect x="660" y="96" width="280" height="96" rx="12" fill="#F2F7FB" stroke="#8FB5D2" stroke-width="1.5"/><text x="800" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F"><tspan x="800" y="129">客户自有应用</tspan></text><text x="800" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="800" y="154">Web / Mobile / Backend；携带项目选定凭据</tspan></text></g><g data-node-id="edge-api"><rect x="169" y="316" width="280" height="96" rx="12" fill="#F8F4FC" stroke="#B9A3D5" stroke-width="1.5"/><text x="309" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#4C1D95"><tspan x="309" y="351">Azure API Management</tspan></text><text x="309" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="309" y="372">可选统一入口：认证策略、限流；必须关闭</tspan><tspan x="309" y="387">SSE 响应缓冲</tspan></text></g><g data-node-id="conversation-runtime"><rect x="660" y="316" width="280" height="96" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="800" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#9F1239"><tspan x="800" y="351">Streaming API Runtime</tspan></text><text x="800" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="800" y="372">调用方访问控制、限流、取消与超时；归约与透</tspan><tspan x="800" y="387">传两种写出模式</tspan></text></g><g data-node-id="session-store"><rect x="660" y="440" width="280" height="96" rx="12" fill="#FFF9E8" stroke="#D4B266" stroke-width="1.5"/><text x="800" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#713F12"><tspan x="800" y="475">会话状态存储</tspan></text><text x="800" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="800" y="496">不透明 ID 映射上游 conversationId；ETag、</tspan><tspan x="800" y="511">TTL、turn 锁</tspan></text></g><g data-node-id="d2e-adapter"><rect x="1151" y="316" width="280" height="96" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="1291" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#9F1239"><tspan x="1291" y="351">D2E Streaming Adapter</tspan></text><text x="1291" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="1291" y="372">单一帧读取路径：D2E POST、Activity SSE</tspan><tspan x="1291" y="387">解析、超时分类</tspan></text></g><g data-node-id="identity-cache"><rect x="1151" y="440" width="280" height="96" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="1.5"/><text x="1291" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#9F1239"><tspan x="1291" y="475">专用 delegated 身份</tspan></text><text x="1291" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="1291" y="496">专用用户账号 + 加密 MSAL cache（本机</tspan><tspan x="1291" y="511">mode 600 文件）</tspan></text></g><g data-node-id="entra-id"><rect x="169" y="660" width="280" height="96" rx="12" fill="#F2F7FB" stroke="#8FB5D2" stroke-width="1.5"/><text x="309" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F"><tspan x="309" y="695">Microsoft Entra ID</tspan></text><text x="309" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="309" y="716">签发 delegated token；scope 为</tspan><tspan x="309" y="731">api.powerplatform.com/.default</tspan></text></g><g data-node-id="d2e-runtime"><rect x="660" y="660" width="280" height="96" rx="12" fill="#F2F7FB" stroke="#8FB5D2" stroke-width="1.5"/><text x="800" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F"><tspan x="800" y="693">Power Platform D2E</tspan></text><text x="800" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="800" y="718">校验 delegated 身份，返回 Activity SSE</tspan></text></g><g data-node-id="anonymous-agent"><rect x="1151" y="660" width="280" height="96" rx="12" fill="#F2F7FB" stroke="#8FB5D2" stroke-width="1.5"/><text x="1291" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F"><tspan x="1291" y="693">已发布 No Authentication Agent</tspan></text><text x="1291" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="1291" y="718">不要求最终用户 Entra 登录</tspan></text></g></svg>
