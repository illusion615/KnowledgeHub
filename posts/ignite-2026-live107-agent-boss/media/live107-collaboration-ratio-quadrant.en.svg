.72))" stroke="var(--fig-group-border, rgba(23,36,48,0.11))" stroke-width="1.25"/><rect x="532" y="98" width="454" height="174" rx="14" fill="var(--fig-quadrant-tint, rgba(13,143,140,0.05))"/><line x1="532" y1="98" x2="532" y2="446" stroke="var(--fig-axis-line, rgba(23,36,48,0.24))" stroke-width="1.35" stroke-dasharray="6 5"/><line x1="78" y1="272" x2="986" y2="272" stroke="var(--fig-axis-line, rgba(23,36,48,0.24))" stroke-width="1.35" stroke-dasharray="6 5"/><text x="96" y="124" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="var(--fig-text-subtle, #64748b)">Over-Engineered AI (Prefer Deterministic Flow)</text><text x="968" y="124" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--fig-role-teal-text, #115e59)">High-Touch Boss Zone: ~1:5 Agent Ratio (Code / Auto)</text><text x="96" y="432" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700" fill="var(--fig-text-subtle, #64748b)">Broad Span Zone: ~1:10 Agent Ratio (Chat / Co-work)</text><text x="968" y="432" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="12.5" font-weight="700" fill="var(--fig-role-amber-text, #78350f)">Unaccountable Drift &amp; Wasted Token/Credit Burn</text><text x="532" y="484" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fig-text-muted, #52616d)">Agent Reasoning &amp; Autonomous Execution Reach (Retrieval → Tasks → Autonomy) →</text><g transform="translate(26,272) rotate(-90)"><text x="0" y="0" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fig-text-muted, #52616d)">Human Boss Investment in Specs, Policy Guardrails &amp; Evals →</text></g><g data-point-id="mode-assist-chat"><circle cx="260" cy="362" r="14.5" fill="var(--fig-role-teal-fill, rgba(13, 143, 140, 0.09))" stroke="var(--fig-role-teal-stroke, rgba(13, 143, 140, 0.46))" stroke-width="1"/><circle cx="260" cy="362" r="8.5" fill="var(--fig-role-teal-bar, #0d8f8c)"/><text x="280.5" y="346" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">1. Assist Mode (Chat · ~1:10 Ratio)</text><text x="280.5" y="363" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">Human drafts work · AI retrieves, reviews &amp; summarizes</text></g><g data-point-id="mode-delegate-cowork"><circle cx="459" cy="307" r="14.5" fill="var(--fig-role-blue-fill, rgba(37, 99, 235, 0.07))" stroke="var(--fig-role-blue-stroke, rgba(59, 130, 246, 0.42))" stroke-width="1"/><circle cx="459" cy="307" r="8.5" fill="var(--fig-role-blue-bar, #2563eb)"/><text x="479.5" y="303" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">2. Delegate Mode (Co-work Deliverables)</text><text x="479.5" y="320" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">Human defines scope · AI drafts PPT/Word for human edit</text></g><g data-point-id="deterministic-workflow"><circle cx="314" cy="188" r="14.5" fill="var(--fig-role-violet-fill, rgba(124, 58, 237, 0.08))" stroke="var(--fig-role-violet-stroke, rgba(139, 92, 246, 0.42))" stroke-width="1"/><circle cx="314" cy="188" r="8.5" fill="var(--fig-role-violet-bar, #7c3aed)"/><text x="334.5" y="174" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">Deterministic Workflow (Non-AI Route)</text><text x="334.5" y="191" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="start" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">Fixed steps skip LLMs · Saves token &amp; credit budget</text></g><g data-point-id="mode-build-code"><circle cx="695" cy="195" r="14.5" fill="var(--fig-role-accent-fill, rgba(255, 122, 0, 0.09))" stroke="var(--fig-role-accent-stroke, rgba(234, 88, 12, 0.48))" stroke-width="1"/><circle cx="695" cy="195" r="8.5" fill="var(--fig-role-accent-bar, #ea580c)"/><text x="674.5" y="210" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">3. Build Mode (Spec-Driven Custom AI)</text><text x="674.5" y="227" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">Human writes crisp specs · Blends apps, flows &amp; agents</text></g><g data-point-id="mode-automate-auto"><circle cx="877" cy="147" r="14.5" fill="var(--fig-role-rose-fill, rgba(225, 29, 72, 0.08))" stroke="var(--fig-role-rose-stroke, rgba(225, 29, 72, 0.48))" stroke-width="1"/><circle cx="877" cy="147" r="8.5" fill="var(--fig-role-rose-bar, #e11d48)"/><text x="856.5" y="136" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">4. Automate Mode (Autopilot · ~1:5 Ratio)</text><text x="856.5" y="153" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">Focuses on permissions, policies &amp; evals · Always-on</text></g><g data-point-id="unmanaged-sprawl"><circle cx="804" cy="376" r="14.5" fill="var(--fig-role-slate-fill, rgba(71, 85, 105, 0.07))" stroke="var(--fig-role-slate-stroke, rgba(100, 116, 139, 0.38))" stroke-width="1"/><circle cx="804" cy="376" r="8.5" fill="var(--fig-role-slate-bar, #64748b)"/><text x="783.5" y="384" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="13.5" font-weight="700" fill="var(--fig-text-strong, #172430)">Unmanaged Duplicate / Over-Scheduled Bots</text><text x="783.5" y="401" font-family="Space Grotesk, Noto Sans SC, -apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end" font-size="11.5" font-weight="500" fill="var(--fig-text-muted, #52616d)">Redundant 3-4x daily runs · Retire or merge via A2A</text></g></svg>
