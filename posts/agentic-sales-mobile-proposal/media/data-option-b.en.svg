<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Option B: Live API Data Architecture</title><desc id="diagram-desc">architecture diagram with 3 nodes and 2 connections</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs><g data-group-id="client"><rect x="40" y="24" width="1320" height="184" rx="18" fill="#FFF9F3" stroke="#DED2C3" stroke-width="2"/><line x1="40" y1="72" x2="1360" y2="72" stroke="#DED2C3" stroke-width="1.5"/><text x="58" y="55" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#7C2D12">Power Platform Client</text></g><g data-group-id="integration"><rect x="40" y="240" width="1320" height="184" rx="18" fill="#F7FAFC" stroke="#CAD7E2" stroke-width="2"/><line x1="40" y1="288" x2="1360" y2="288" stroke="#CAD7E2" stroke-width="1.5"/><text x="58" y="271" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">API Access Gateway [We Implement]</text></g><g data-group-id="crm"><rect x="40" y="456" width="1320" height="184" rx="18" fill="#FAF8FC" stroke="#D8CEE5" stroke-width="2"/><line x1="40" y1="504" x2="1360" y2="504" stroke="#D8CEE5" stroke-width="1.5"/><text x="58" y="487" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#4C1D95">Legacy CRM [Require High-Avail APIs]</text></g><path d="M 700 184 V 224 H 700 V 312" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="714" y="216" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">Issue Authenticated Operations</text><path d="M 700 400 V 440 H 700 V 528" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="714" y="432" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">Route with Identity Passthrough</text><g data-node-id="apps"><rect x="520" y="96" width="360" height="88" rx="12" fill="#EFF9F7" stroke="#78BDB5" stroke-width="1.5"/><text x="700" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#115E59"><tspan x="700" y="129">Power Apps Code App / Agents</tspan></text><text x="700" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="700" y="154">Issue Commands and Display Response (No Replica)</tspan></text></g><g data-node-id="apim"><rect x="520" y="312" width="360" height="88" rx="12" fill="#F2F7FB" stroke="#8FB5D2" stroke-width="1.5"/><text x="700" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F"><tspan x="700" y="345">Azure API Management</tspan></text><text x="700" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="700" y="370">Identity Exchange, Circuit Breaking, Telemetry</tspan></text></g><g data-node-id="crm-api"><rect x="520" y="528" width="360" height="88" rx="12" fill="#F8F4FC" stroke="#B9A3D5" stroke-width="1.5"/><text x="700" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#4C1D95"><tspan x="700" y="561">Legacy CRM REST API</tspan></text><text x="700" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="700" y="586">Authoritative Logic, Absorbs Full Live Throughput</tspan></text></g></svg>
