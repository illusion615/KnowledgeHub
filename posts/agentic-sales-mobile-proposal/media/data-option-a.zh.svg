<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">方案 A：全量复制数据集成架构</title><desc id="diagram-desc">architecture diagram with 4 nodes and 3 connections</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs><g data-group-id="dataverse"><rect x="40" y="24" width="1320" height="184" rx="18" fill="#FFF9F3" stroke="#DED2C3" stroke-width="2"/><line x1="40" y1="72" x2="1360" y2="72" stroke="#DED2C3" stroke-width="1.5"/><text x="58" y="55" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#7C2D12">Microsoft Dataverse</text></g><g data-group-id="integration"><rect x="40" y="240" width="1320" height="184" rx="18" fill="#F7FAFC" stroke="#CAD7E2" stroke-width="2"/><line x1="40" y1="288" x2="1360" y2="288" stroke="#CAD7E2" stroke-width="1.5"/><text x="58" y="271" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">双向同步中台 [我们实施]</text></g><g data-group-id="crm"><rect x="40" y="456" width="1320" height="184" rx="18" fill="#FAF8FC" stroke="#D8CEE5" stroke-width="2"/><line x1="40" y1="504" x2="1360" y2="504" stroke="#D8CEE5" stroke-width="1.5"/><text x="58" y="487" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#4C1D95">既有 CRM [需提供接口]</text></g><path d="M 700 184 V 224 H 1018 V 312" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="1032" y="216" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">推送本地或 CRM 变更</text><path d="M 838 356 H 562" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="700" y="348" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">可靠消费带锁消息</text><path d="M 382 400 V 440 H 700 V 528" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="714" y="432" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">同步至源端或目标端（避免闭环）</text><g data-node-id="dataverse-db"><rect x="520" y="96" width="360" height="88" rx="12" fill="#F8F4FC" stroke="#B9A3D5" stroke-width="1.5"/><text x="700" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#4C1D95"><tspan x="700" y="129">Microsoft Dataverse</tspan></text><text x="700" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="700" y="154">全量业务记录副本与本地事务边界</tspan></text></g><g data-node-id="sb"><rect x="838" y="312" width="360" height="88" rx="12" fill="#F2F7FB" stroke="#8FB5D2" stroke-width="1.5"/><text x="1018" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F"><tspan x="1018" y="345">Azure Service Bus</tspan></text><text x="1018" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="1018" y="370">变更事件队列、削峰与死信</tspan></text></g><g data-node-id="fn"><rect x="202" y="312" width="360" height="88" rx="12" fill="#FFF9E8" stroke="#D4B266" stroke-width="1.5"/><text x="382" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#713F12"><tspan x="382" y="345">Azure Functions Sync Worker</tspan></text><text x="382" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="382" y="370">字段映射与冲突合并（双向执行器）</tspan></text></g><g data-node-id="crm-sys"><rect x="520" y="528" width="360" height="88" rx="12" fill="#F8F4FC" stroke="#B9A3D5" stroke-width="1.5"/><text x="700" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#4C1D95"><tspan x="700" y="56