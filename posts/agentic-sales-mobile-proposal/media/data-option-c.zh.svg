<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 950" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">方案 C：反向近实时投影与同步校验架构</title><desc id="diagram-desc">architecture diagram with 6 nodes and 5 connections</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748B"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0F172A" flood-opacity="0.12"/></filter></defs><g data-group-id="client"><rect x="40" y="24" width="1420" height="184" rx="18" fill="#FFF9F3" stroke="#DED2C3" stroke-width="2"/><line x1="40" y1="72" x2="1460" y2="72" stroke="#DED2C3" stroke-width="1.5"/><text x="58" y="55" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#7C2D12">Power Platform 消费端</text></g><g data-group-id="dataverse"><rect x="40" y="240" width="1420" height="184" rx="18" fill="#F7FAFC" stroke="#CAD7E2" stroke-width="2"/><line x1="40" y1="288" x2="1460" y2="288" stroke="#CAD7E2" stroke-width="1.5"/><text x="58" y="271" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F">Microsoft Dataverse</text></g><g data-group-id="integration"><rect x="40" y="456" width="1420" height="184" rx="18" fill="#FAF8FC" stroke="#D8CEE5" stroke-width="2"/><line x1="40" y1="504" x2="1460" y2="504" stroke="#D8CEE5" stroke-width="1.5"/><text x="58" y="487" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#4C1D95">双路集成中台 [我们实施]</text></g><g data-group-id="crm"><rect x="40" y="672" width="1420" height="184" rx="18" fill="#F5FAF8" stroke="#C5DDD8" stroke-width="2"/><line x1="40" y1="720" x2="1460" y2="720" stroke="#C5DDD8" stroke-width="1.5"/><text x="58" y="703" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#115E59">既有 CRM [职责：开放两类边界约束]</text></g><path d="M 750 184 V 224 H 750 V 312" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="764" y="216" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">默认超高响应读取链路</text><path d="M 750 184 V 332 H 1093 V 528" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="1107" y="324" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">强一致性验证提交</text><path d="M 1093 616 V 656 H 1093 V 744" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="1107" y="648" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">防脏读与防旧值写入</text><path d="M 407 744 V 680 H 407 V 616" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="421" y="672" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">源头变更扇出</text><path d="M 407 528 V 464 H 750 V 400" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/><text x="764" y="456" text-anchor="start" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#475569">应用严格新版本</text><g data-node-id="apps"><rect x="560" y="96" width="380" height="88" rx="12" fill="#EFF9F7" stroke="#78BDB5" stroke-width="1.5"/><text x="750" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#115E59"><tspan x="750" y="129">Power Apps Code App / Agents</tspan></text><text x="750" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="750" y="154">基于新鲜度标识降级，分离关键动作路由</tspan></text></g><g data-node-id="proj"><rect x="560" y="312" width="380" height="88" rx="12" fill="#F8F4FC" stroke="#B9A3D5" stroke-width="1.5"/><text x="750" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#4C1D95"><tspan x="750" y="345">Dataverse Projection</tspan></text><text x="750" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="750" y="370">只读投影 (附带来源版本号与同步时间戳)</tspan></text></g><g data-node-id="apim"><rect x="903" y="528" width="380" height="88" rx="12" fill="#F2F7FB" stroke="#8FB5D2" stroke-width="1.5"/><text x="1093" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F"><tspan x="1093" y="561">Azure API Management</tspan></text><text x="1093" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="1093" y="586">订单库存等强校验拦截动作提交的网关</tspan></text></g><g data-node-id="async"><rect x="217" y="528" width="380" height="88" rx="12" fill="#FFF9E8" stroke="#D4B266" stroke-width="1.5"/><text x="407" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#713F12"><tspan x="407" y="561">Azure Service Bus + Functions</tspan></text><text x="407" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="407" y="586">事件缓冲对列、提取最新版本以防倒旧写</tspan></text></g><g data-node-id="crm-api"><rect x="903" y="744" width="380" height="88" rx="12" fill="#F8F4FC" stroke="#B9A3D5" stroke-width="1.5"/><text x="1093" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#4C1D95"><tspan x="1093" y="777">Legacy CRM REST API</tspan></text><text x="1093" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="1093" y="802">提供源版本号 (RowVersion) 的乐观锁接口</tspan></text></g><g data-node-id="crm-event"><rect x="217" y="744" width="380" height="88" rx="12" fill="#F2F7FB" stroke="#8FB5D2" stroke-width="1.5"/><text x="407" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="700" fill="#1E3A5F"><tspan x="407" y="777">Legacy CRM Event Publisher</tspan></text><text x="407" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="12" fill="#64748B"><tspan x="407" y="802">基于 CDC / Webhook 吐出规范化主件流</tspan></text></g></svg>
