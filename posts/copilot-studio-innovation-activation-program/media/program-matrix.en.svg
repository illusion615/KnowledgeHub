<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Agentic AI Innovation Accelerator five-phase, three-role execution matrix</title>
  <desc id="desc">Five phases form columns; Microsoft and ecosystem, Customer IT and CoE, and Business Teams form rows. Every cell lists an action, entry criteria, and output.</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans", "Segoe UI", sans-serif; fill: #18324a; }
      .phase-no { font-size: 14px; font-weight: 700; fill: #0f766e; letter-spacing: 1px; }
      .phase-title { font-size: 19px; font-weight: 800; }
      .phase-gate { font-size: 12.5px; fill: #64748b; }
      .role { font-size: 18px; font-weight: 800; }
      .role-sub { font-size: 12px; fill: #64748b; }
      .action { font-size: 15px; font-weight: 800; }
      .label { font-size: 11.5px; font-weight: 700; fill: #0f766e; letter-spacing: .5px; }
      .copy { font-size: 13px; fill: #475569; }
      .header { fill: #f0fdfa; stroke: #99d5cf; stroke-width: 1.5; }
      .lane-ms { fill: #f3f8fc; stroke: #a9c6da; stroke-width: 1.5; }
      .lane-it { fill: #fff9e9; stroke: #dcc67d; stroke-width: 1.5; }
      .lane-biz { fill: #fff6ed; stroke: #e7b889; stroke-width: 1.5; }
      .role-ms { fill: #dcecf7; }
      .role-it { fill: #f7e9b6; }
      .role-biz { fill: #f8ddc3; }
      .flow { stroke: #14b8a6; stroke-width: 3; fill: none; }
      .divider { stroke: #d7e0e7; stroke-width: 1; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#14b8a6"/></marker>
  </defs>

  <path class="flow" marker-end="url(#arrow)" d="M310 46 H1715"/>
  <text x="310" y="25" class="phase-no">AMBITION</text><text x="1715" y="25" class="phase-no" text-anchor="end">ADOPTION</text>

  <g>
    <rect class="header" x="260" y="72" width="300" height="112" rx="10"/><text x="282" y="102" class="phase-no">01</text><text x="282" y="132" class="phase-title">Discover &amp; Align</text><text x="282" y="160" class="phase-gate">Sponsor Charter · IT Readiness</text>
    <rect class="header" x="570" y="72" width="300" height="112" rx="10"/><text x="592" y="102" class="phase-no">02</text><text x="592" y="132" class="phase-title">Inspire &amp; Collect</text><text x="592" y="160" class="phase-gate">Qualified Scenario Backlog</text>
    <rect class="header" x="880" y="72" width="300" height="112" rx="10"/><text x="902" y="102" class="phase-no">03</text><text x="902" y="132" class="phase-title">Prioritize Top 3</text><text x="902" y="160" class="phase-gate">Use Case Lock</text>
    <rect class="header" x="1190" y="72" width="300" height="112" rx="10"/><text x="1212" y="102" class="phase-no">04</text><text x="1212" y="132" class="phase-title">Build &amp; Learn</text><text x="1212" y="160" class="phase-gate">MVP Demo · Hardening Gate</text>
    <rect class="header" x="1500" y="72" width="300" height="112" rx="10"/><text x="1522" y="102" class="phase-no">05</text><text x="1522" y="132" class="phase-title">Adopt &amp; Scale</text><text x="1522" y="160" class="phase-gate">CoE Handoff · Outcome Review</text>
  </g>

  <g>
    <rect class="role-ms" x="20" y="200" width="220" height="260" rx="10"/><text x="42" y="246" class="role">Microsoft &amp;</text><text x="42" y="272" class="role">Ecosystem</text><text class="role-sub"><tspan x="42" y="302">Method · Coaching</tspan><tspan x="42" y="324">Expertise</tspan></text>
    <rect class="role-it" x="20" y="472" width="220" height="260" rx="10"/><text x="42" y="518" class="role">Customer IT / CoE</text><text class="role-sub"><tspan x="42" y="548">Platform · Governance</tspan><tspan x="42" y="570">Operations</tspan></text>
    <rect class="role-biz" x="20" y="744" width="220" height="260" rx="10"/><text x="42" y="790" class="role">Business Teams</text><text class="role-sub"><tspan x="42" y="820">Scenario · Evidence</tspan><tspan x="42" y="842">Adoption</tspan></text>
  </g>

  <g transform="translate(260 200)">
    <rect class="lane-ms" width="300" height="260" rx="10"/><text x="20" y="34" class="action">Interview and align stakeholders</text><line x1="20" y1="50" x2="280" y2="50" class="divider"/><text x="20" y="78" class="label">ENTRY</text><text x="20" y="101" class="copy">Named sponsor; initial business goal</text><text x="20" y="136" class="label">OUTPUT</text><text x="20" y="159" class="copy">Interview findings; charter draft</text>
    <rect class="lane-ms" x="310" width="300" height="260" rx="10"/><text x="330" y="34" class="action">Inspire with tiered patterns</text><line x1="330" y1="50" x2="590" y2="50" class="divider"/><text x="330" y="78" class="label">ENTRY</text><text x="330" y="101" class="copy">Signed charter; functions confirmed</text><text x="330" y="136" class="label">OUTPUT</text><text x="330" y="159" class="copy">Inspiration deck; intake guidance</text>
    <rect class="lane-ms" x="620" width="300" height="260" rx="10"/><text x="640" y="34" class="action">Facilitate value-feasibility scoring</text><line x1="640" y1="50" x2="900" y2="50" class="divider"/><text x="640" y="78" class="label">ENTRY</text><text x="640" y="101" class="copy">Qualified backlog; agreed rubric</text><text x="640" y="136" class="label">OUTPUT</text><text x="640" y="159" class="copy">Top-three recommendation; decision log</text>
    <rect class="lane-ms" x="930" width="300" height="260" rx="10"/><text x="950" y="34" class="action">Coach builds; unblock architecture</text><line x1="950" y1="50" x2="1210" y2="50" class="divider"/><text x="950" y="78" class="label">ENTRY</text><text x="950" y="101" class="copy">Use Case Lock; lab plan ready</text><text x="950" y="136" class="label">OUTPUT</text><text x="950" y="159" class="copy">Demonstrable MVP; hardening advice</text>
    <rect class="lane-ms" x="1240" width="300" height="260" rx="10"/><text x="1260" y="34" class="action">Run office hours and reviews</text><line x1="1260" y1="50" x2="1520" y2="50" class="divider"/><text x="1260" y="78" class="label">ENTRY</text><text x="1260" y="101" class="copy">Controlled pilot; support period agreed</text><text x="1260" y="136" class="label">OUTPUT</text><text x="1260" y="159" class="copy">Improvement advice; next-wave input</text>
  </g>

  <g transform="translate(260 472)">
    <rect class="lane-it" width="300" height="260" rx="10"/><text x="20" y="34" class="action">Assess platform, data, and controls</text><line x1="20" y1="50" x2="280" y2="50" class="divider"/><text x="20" y="78" class="label">ENTRY</text><text x="20" y="101" class="copy">Environment owner; policies available</text><text x="20" y="136" class="label">OUTPUT</text><text x="20" y="159" class="copy">IT readiness check; blocker register</text>
    <rect class="lane-it" x="310" width="300" height="260" rx="10"/><text x="330" y="34" class="action">Open intake and flag constraints</text><line x1="330" y1="50" x2="590" y2="50" class="divider"/><text x="330" y="78" class="label">ENTRY</text><text x="330" y="101" class="copy">Published intake; data boundary known</text><text x="330" y="136" class="label">OUTPUT</text><text x="330" y="159" class="copy">Technical constraints; connection options</text>
    <rect class="lane-it" x="620" width="300" height="260" rx="10"/><text x="640" y="34" class="action">Assess security, DLP, operability</text><line x1="640" y1="50" x2="900" y2="50" class="divider"/><text x="640" y="78" class="label">ENTRY</text><text x="640" y="101" class="copy">Candidate top three; dependencies visible</text><text x="640" y="136" class="label">OUTPUT</text><text x="640" y="159" class="copy">Readiness result; support and risk path</text>
    <rect class="lane-it" x="930" width="300" height="260" rx="10"/><text x="950" y="34" class="action">Prepare and harden runtime</text><line x1="950" y1="50" x2="1210" y2="50" class="divider"/><text x="950" y="78" class="label">ENTRY</text><text x="950" y="101" class="copy">Accounts, connectors, and examples ready</text><text x="950" y="136" class="label">OUTPUT</text><text x="950" y="159" class="copy">Hardening backlog; pilot approval</text>
    <rect class="lane-it" x="1240" width="300" height="260" rx="10"/><text x="1260" y="34" class="action">Own release, monitoring, support</text><line x1="1260" y1="50" x2="1520" y2="50" class="divider"/><text x="1260" y="78" class="label">ENTRY</text><text x="1260" y="101" class="copy">Hardening passed; owner accepts handoff</text><text x="1260" y="136" class="label">OUTPUT</text><text x="1260" y="159" class="copy">Runbook; support model; CoE handoff</text>
  </g>

  <g transform="translate(260 744)">
    <rect class="lane-biz" width="300" height="260" rx="10"/><text x="20" y="34" class="action">Define pain and target outcome</text><line x1="20" y1="50" x2="280" y2="50" class="divider"/><text x="20" y="78" class="label">ENTRY</text><text x="20" y="101" class="copy">Business owner and SME participate</text><text x="20" y="136" class="label">OUTPUT</text><text x="20" y="159" class="copy">Problem statement; flow and baseline</text>
    <rect class="lane-biz" x="310" width="300" height="260" rx="10"/><text x="330" y="34" class="action">Submit real scenarios and examples</text><line x1="330" y1="50" x2="590" y2="50" class="divider"/><text x="330" y="78" class="label">ENTRY</text><text x="330" y="101" class="copy">Intake open; submission standard clear</text><text x="330" y="136" class="label">OUTPUT</text><text x="330" y="159" class="copy">Scenario brief; examples; target change</text>
    <rect class="lane-biz" x="620" width="300" height="260" rx="10"/><text x="640" y="34" class="action">Commit baseline &amp; acceptance</text><line x1="640" y1="50" x2="900" y2="50" class="divider"/><text x="640" y="78" class="label">ENTRY</text><text x="640" y="101" class="copy">Comparable scores; resources committed</text><text x="640" y="136" class="label">OUTPUT</text><text x="640" y="159" class="copy">Use-case canvas; acceptance measures</text>
    <rect class="lane-biz" x="930" width="300" height="260" rx="10"/><text x="950" y="34" class="action">Build and run representative tests</text><line x1="950" y1="50" x2="1210" y2="50" class="divider"/><text x="950" y="78" class="label">ENTRY</text><text x="950" y="101" class="copy">Test set, users, and measures ready</text><text x="950" y="136" class="label">OUTPUT</text><text x="950" y="159" class="copy">Test record; MVP acceptance decision</text>
    <rect class="lane-biz" x="1240" width="300" height="260" rx="10"/><text x="1260" y="34" class="action">Run pilot and compare baseline</text><line x1="1260" y1="50" x2="1520" y2="50" class="divider"/><text x="1260" y="78" class="label">ENTRY</text><text x="1260" y="101" class="copy">Pilot approved; users and window defined</text><text x="1260" y="136" class="label">OUTPUT</text><text x="1260" y="159" class="copy">Outcome scorecard; scale/stop advice</text>
  </g>
</svg>
