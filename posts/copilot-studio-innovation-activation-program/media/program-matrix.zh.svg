<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Agentic AI Innovation Accelerator 五阶段三角色执行矩阵</title>
  <desc id="desc">五个阶段横向排列，微软与生态、客户 IT 与 CoE、业务团队三方角色纵向排列。每个单元格说明动作、进入条件和产出。</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans SC", "PingFang SC", sans-serif; fill: #18324a; }
      .phase-no { font-size: 14px; font-weight: 700; fill: #0f766e; letter-spacing: 1px; }
      .phase-title { font-size: 19px; font-weight: 800; }
      .phase-gate { font-size: 12.5px; fill: #64748b; }
      .role { font-size: 18px; font-weight: 800; }
      .role-sub { font-size: 12px; fill: #64748b; }
      .action { font-size: 15px; font-weight: 800; }
      .label { font-size: 11.5px; font-weight: 700; fill: #0f766e; }
      .copy { font-size: 13px; fill: #475569; }
      .header { fill: #f0fdfa; stroke: #99d5cf; stroke-width: 1.5; }
      .lane-ms { fill: #f3f8fc; stroke: #a9c6da; stroke-width: 1.5; }
      .lane-it { fill: #fff9e9; stroke: #dcc67d; stroke-width: 1.5; }
      .lane-biz { fill: #fff6ed; stroke: #e7b889; stroke-width: 1.5; }
      .role-ms { fill: #dcecf7; }
      .role-it { fill: #f7e9b6; }
      .role-biz { fill: #f8ddc3; }
      .flow { stroke: #14b8a6; stroke-width: 3; fill: none; }
      .divider { stroke: #d7e0e7; stroke-width: 1; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#14b8a6"/></marker>
  </defs>

  <path class="flow" marker-end="url(#arrow)" d="M310 46 H1715"/>
  <text x="310" y="25" class="phase-no">AMBITION</text>
  <text x="1715" y="25" class="phase-no" text-anchor="end">ADOPTION</text>

  <g>
    <rect class="header" x="260" y="72" width="300" height="112" rx="10"/>
    <text x="282" y="102" class="phase-no">01</text><text x="282" y="132" class="phase-title">Discover &amp; Align</text><text x="282" y="160" class="phase-gate">Sponsor Charter · IT Readiness</text>
    <rect class="header" x="570" y="72" width="300" height="112" rx="10"/>
    <text x="592" y="102" class="phase-no">02</text><text x="592" y="132" class="phase-title">Inspire &amp; Collect</text><text x="592" y="160" class="phase-gate">Qualified Scenario Backlog</text>
    <rect class="header" x="880" y="72" width="300" height="112" rx="10"/>
    <text x="902" y="102" class="phase-no">03</text><text x="902" y="132" class="phase-title">Prioritize Top 3</text><text x="902" y="160" class="phase-gate">Use Case Lock</text>
    <rect class="header" x="1190" y="72" width="300" height="112" rx="10"/>
    <text x="1212" y="102" class="phase-no">04</text><text x="1212" y="132" class="phase-title">Build &amp; Learn</text><text x="1212" y="160" class="phase-gate">MVP Demo · Hardening Gate</text>
    <rect class="header" x="1500" y="72" width="300" height="112" rx="10"/>
    <text x="1522" y="102" class="phase-no">05</text><text x="1522" y="132" class="phase-title">Adopt &amp; Scale</text><text x="1522" y="160" class="phase-gate">CoE Handoff · Outcome Review</text>
  </g>

  <g>
    <rect class="role-ms" x="20" y="200" width="220" height="260" rx="10"/>
    <text x="42" y="246" class="role">微软与生态</text><text class="role-sub"><tspan x="42" y="278">Method · Coaching</tspan><tspan x="42" y="300">Expertise</tspan></text>
    <rect class="role-it" x="20" y="472" width="220" height="260" rx="10"/>
    <text x="42" y="518" class="role">客户 IT / CoE</text><text class="role-sub"><tspan x="42" y="550">Platform · Governance</tspan><tspan x="42" y="572">Operations</tspan></text>
    <rect class="role-biz" x="20" y="744" width="220" height="260" rx="10"/>
    <text x="42" y="790" class="role">业务团队</text><text class="role-sub"><tspan x="42" y="822">Scenario · Evidence</tspan><tspan x="42" y="844">Adoption</tspan></text>
  </g>

  <!-- Microsoft row -->
  <g transform="translate(260 200)">
    <rect class="lane-ms" width="300" height="260" rx="10"/><text x="20" y="34" class="action">访谈并对齐关键干系人</text><line x1="20" y1="50" x2="280" y2="50" class="divider"/><text x="20" y="78" class="label">进入条件</text><text x="20" y="101" class="copy">具名 Sponsor；初步业务目标</text><text x="20" y="136" class="label">产出</text><text x="20" y="159" class="copy">访谈结论；Program Charter 草案</text>
    <rect class="lane-ms" x="310" width="300" height="260" rx="10"/><text x="330" y="34" class="action">用分层案例启发场景</text><line x1="330" y1="50" x2="590" y2="50" class="divider"/><text x="330" y="78" class="label">进入条件</text><text x="330" y="101" class="copy">Charter 已签署；参与部门确认</text><text x="330" y="136" class="label">产出</text><text x="330" y="159" class="copy">Inspiration Deck；征集说明</text>
    <rect class="lane-ms" x="620" width="300" height="260" rx="10"/><text x="640" y="34" class="action">主持价值与可行性评估</text><line x1="640" y1="50" x2="900" y2="50" class="divider"/><text x="640" y="78" class="label">进入条件</text><text x="640" y="101" class="copy">合格场景池；评分规则确认</text><text x="640" y="136" class="label">产出</text><text x="640" y="159" class="copy">Top 3 建议；评分与决策记录</text>
    <rect class="lane-ms" x="930" width="300" height="260" rx="10"/><text x="950" y="34" class="action">提供构建教练与架构排障</text><line x1="950" y1="50" x2="1210" y2="50" class="divider"/><text x="950" y="78" class="label">进入条件</text><text x="950" y="101" class="copy">Use Case Lock；实验计划就绪</text><text x="950" y="136" class="label">产出</text><text x="950" y="159" class="copy">可演示 MVP；限制与加固建议</text>
    <rect class="lane-ms" x="1240" width="300" height="260" rx="10"/><text x="1260" y="34" class="action">运行 Office Hours 与复盘</text><line x1="1260" y1="50" x2="1520" y2="50" class="divider"/><text x="1260" y="78" class="label">进入条件</text><text x="1260" y="101" class="copy">受控试点启动；支持周期确认</text><text x="1260" y="136" class="label">产出</text><text x="1260" y="159" class="copy">改进建议；下一批机会输入</text>
  </g>

  <!-- IT row -->
  <g transform="translate(260 472)">
    <rect class="lane-it" width="300" height="260" rx="10"/><text x="20" y="34" class="action">盘点平台、数据与治理条件</text><line x1="20" y1="50" x2="280" y2="50" class="divider"/><text x="20" y="78" class="label">进入条件</text><text x="20" y="101" class="copy">环境 Owner；现有策略可访问</text><text x="20" y="136" class="label">产出</text><text x="20" y="159" class="copy">IT Readiness Check；阻塞清单</text>
    <rect class="lane-it" x="310" width="300" height="260" rx="10"/><text x="330" y="34" class="action">开放征集并标注技术约束</text><line x1="330" y1="50" x2="590" y2="50" class="divider"/><text x="330" y="78" class="label">进入条件</text><text x="330" y="101" class="copy">征集表发布；数据边界明确</text><text x="330" y="136" class="label">产出</text><text x="330" y="159" class="copy">技术约束；可用数据与连接清单</text>
    <rect class="lane-it" x="620" width="300" height="260" rx="10"/><text x="640" y="34" class="action">评估安全、DLP 与运营可行性</text><line x1="640" y1="50" x2="900" y2="50" class="divider"/><text x="640" y="78" class="label">进入条件</text><text x="640" y="101" class="copy">候选 Top 3；依赖已披露</text><text x="640" y="136" class="label">产出</text><text x="640" y="159" class="copy">Readiness 结论；支持与风险路径</text>
    <rect class="lane-it" x="930" width="300" height="260" rx="10"/><text x="950" y="34" class="action">准备环境并执行运行加固</text><line x1="950" y1="50" x2="1210" y2="50" class="divider"/><text x="950" y="78" class="label">进入条件</text><text x="950" y="101" class="copy">账号、连接器与样例数据就绪</text><text x="950" y="136" class="label">产出</text><text x="950" y="159" class="copy">加固 Backlog；有限上线批准</text>
    <rect class="lane-it" x="1240" width="300" height="260" rx="10"/><text x="1260" y="34" class="action">接管发布、监控与支持</text><line x1="1260" y1="50" x2="1520" y2="50" class="divider"/><text x="1260" y="78" class="label">进入条件</text><text x="1260" y="101" class="copy">Hardening Gate 通过；Owner 接受</text><text x="1260" y="136" class="label">产出</text><text x="1260" y="159" class="copy">Runbook；Support Model；CoE Handoff</text>
  </g>

  <!-- Business row -->
  <g transform="translate(260 744)">
    <rect class="lane-biz" width="300" height="260" rx="10"/><text x="20" y="34" class="action">说明流程痛点与目标结果</text><line x1="20" y1="50" x2="280" y2="50" class="divider"/><text x="20" y="78" class="label">进入条件</text><text x="20" y="101" class="copy">业务 Owner 与 SME 参与</text><text x="20" y="136" class="label">产出</text><text x="20" y="159" class="copy">问题陈述；当前流程与基线</text>
    <rect class="lane-biz" x="310" width="300" height="260" rx="10"/><text x="330" y="34" class="action">提交真实场景与代表性样例</text><line x1="330" y1="50" x2="590" y2="50" class="divider"/><text x="330" y="78" class="label">进入条件</text><text x="330" y="101" class="copy">征集入口开放；提交标准明确</text><text x="330" y="136" class="label">产出</text><text x="330" y="159" class="copy">场景简报；样例与预期变化</text>
    <rect class="lane-biz" x="620" width="300" height="260" rx="10"/><text x="640" y="34" class="action">确认 Owner、基线与验收标准</text><line x1="640" y1="50" x2="900" y2="50" class="divider"/><text x="640" y="78" class="label">进入条件</text><text x="640" y="101" class="copy">评分结果可比较；资源可承诺</text><text x="640" y="136" class="label">产出</text><text x="640" y="159" class="copy">Use Case Canvas；业务验收口径</text>
    <rect class="lane-biz" x="930" width="300" height="260" rx="10"/><text x="950" y="34" class="action">动手构建并执行代表性测试</text><line x1="950" y1="50" x2="1210" y2="50" class="divider"/><text x="950" y="78" class="label">进入条件</text><text x="950" y="101" class="copy">测试集、参与者与验收口径就绪</text><text x="950" y="136" class="label">产出</text><text x="950" y="159" class="copy">测试记录；MVP Demo 验收决定</text>
    <rect class="lane-biz" x="1240" width="300" height="260" rx="10"/><text x="1260" y="34" class="action">运行试点并比较业务基线</text><line x1="1260" y1="50" x2="1520" y2="50" class="divider"/><text x="1260" y="78" class="label">进入条件</text><text x="1260" y="101" class="copy">有限上线批准；用户和窗口明确</text><text x="1260" y="136" class="label">产出</text><text x="1260" y="159" class="copy">Outcome Scorecard；扩展/停止建议</text>
  </g>
</svg>
